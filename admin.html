<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['"DM Sans"','system-ui','sans-serif'], mono:['"JetBrains Mono"','monospace'] },
  colors: {
    primary:{DEFAULT:'#0F5EE8',light:'#EFF6FF',border:'#93C5FD'},
    success:{DEFAULT:'#10B981',light:'#F0FDF4'},
    warning:{DEFAULT:'#F59E0B',light:'#FFFBEB'},
    danger:{DEFAULT:'#EF4444',light:'#FEF2F2'},
    purple:{DEFAULT:'#8B5CF6',light:'#EEEDFE'},
    ink:{900:'#111827',500:'#6B7280',400:'#9CA3AF'},
    line:'#E5E7EB', surface:'#F9FAFB',

<style>
  html,body{font-family:'DM Sans',system-ui,sans-serif;color:#111827;background:#F9FAFB}
  *:focus-visible{outline:2px solid #0F5EE8;outline-offset:2px;border-radius:4px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#D1D5DB}
  ::-webkit-scrollbar-track{background:transparent}
  .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
  .dropdown-shadow{box-shadow:0 12px 32px rgba(17,24,39,0.14),0 2px 6px rgba(17,24,39,0.06)}
  /* item rows */
  .item-row{transition:background .12s ease,border-color .12s ease}
  .item-row:hover{background:#FCFCFD}
  .pri-Core{color:#EF4444;background:#FEF2F2}
  .pri-Helpful{color:#0F5EE8;background:#EFF6FF}
  .pri-Optional{color:#6B7280;background:#F3F4F6}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;border:1px solid transparent}
  .chip-input{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9999px;font-size:12px;background:#F3F4F6;color:#111827;border:1px solid #E5E7EB}
  .chip-input button{color:#9CA3AF}.chip-input button:hover{color:#EF4444}
  /* toggle */
  .toggle{position:relative;width:36px;height:20px;background:#E5E7EB;border-radius:9999px;cursor:pointer;transition:background .15s}
  .toggle .dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:9999px;background:white;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
  .toggle.on{background:#10B981}.toggle.on .dot{left:18px}
  /* edit panel */
  #editPanel{transform:translateX(100%);transition:transform 280ms ease}
  #editPanel.open{transform:translateX(0)}
  #backdrop{opacity:0;pointer-events:none;transition:opacity 280ms ease}
  #backdrop.open{opacity:1;pointer-events:auto}
  /* activity panel */
  #activityPanel{transition:transform 280ms ease, width 280ms ease}
  #activityPanel.collapsed{transform:translateX(100%);width:0}
  /* tabs/scoped tag */
  .tab-active{background:#0F5EE8;color:white;border-color:#0F5EE8}
  /* toast */
  .toast{transform:translateY(80px);opacity:0;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s ease}
  .toast.show{transform:translateY(0);opacity:1}
  /* anchor offset for sticky topbar */
  .sec-anchor{scroll-margin-top:80px}
  /* small inputs */
  .inp{background:white;border:1px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:13px;color:#111827}
  .inp:focus{outline:none;border-color:#0F5EE8;box-shadow:0 0 0 3px rgba(15,94,232,.15)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:13px;border-radius:8px;border:1px solid #E5E7EB;background:white;color:#111827;cursor:pointer}
  .btn:hover{background:#F9FAFB}
  .btn-primary{background:#0F5EE8;color:white;border-color:#0F5EE8}
  .btn-primary:hover{background:#0D4FC2}
  .btn-danger{background:#FEF2F2;color:#EF4444;border-color:#FECACA}
  .btn-danger:hover{background:#FECACA}
</style>
</head>
<body class="min-h-screen">
<div class="flex min-h-screen">

      </div>
    </div>

      <div class="flex-1 min-w-0"><div class="text-[12.5px] font-medium text-ink-900 truncate">Rajesh Kumar</div><div class="text-[10.5px] text-ink-500 truncate">Super Admin</div></div>

  </aside>

  <!-- =================== MAIN COLUMN =================== -->

      <div class="flex-1 max-w-xl relative">

        <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-[12px] font-semibold">RK</div>
        <div class="hidden md:block text-left"><div class="text-[12.5px] font-medium text-ink-900 leading-tight">Rajesh Kumar</div><div class="text-[10.5px] text-ink-500 leading-tight">Super Admin</div></div>
      </div>
    </header>

    <div class="flex-1 flex min-w-0">
      <main id="content" class="flex-1 overflow-y-auto px-8 py-6 space-y-6 min-w-0"></main>

      <!-- Activity panel -->
      <aside id="activityPanel" class="collapsed w-[320px] shrink-0 border-l border-line bg-white overflow-y-auto">
        <div class="px-4 py-3.5 border-b border-line flex items-center justify-between sticky top-0 bg-white z-10">
          <div class="text-[14px] font-semibold text-ink-900 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-ink-500"></i> Activity trail</div>
          <button onclick="document.getElementById('activityPanel').classList.add('collapsed');document.getElementById('activityToggle').setAttribute('aria-expanded','false')" class="text-ink-400 hover:text-ink-900"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <ul id="activityFeed" class="px-4 py-3 space-y-3.5"></ul>
      </aside>
    </div>
  </div>
</div>

<!-- =================== EDIT PANEL (720px) =================== -->
<div id="backdrop" class="fixed inset-0 bg-black/30 z-40"></div>

  <div class="px-6 py-3 border-t border-line flex items-center justify-between gap-3 shrink-0 bg-surface">

    <div class="flex items-center gap-2">
      <button onclick="closeEdit()" class="btn">Close</button>

  </div>
</aside>

  {id:'ai.prompts', m:'ai', s:'B · AI configuration', p:'Core', t:'lib',
    title:'Master-prompt library',
    why:'Single editable bank of prompts feeding every AI surface in every module.',
    def:[
      {key:'extract.queries', surface:'Pre-Bid → Extract queries', prompt:'Extract individual procurement-related questions from the uploaded document. For each, identify the section it pertains to (PQ, BOQ, Dates, Scope, Financial, Technical, General). Return as a structured list. Strip vendor names per anonymisation policy.'},
      {key:'group.queries', surface:'Pre-Bid → Group queries', prompt:'Group similar queries together. Two queries are "similar" if they ask the same procurement question even with different wording.'},
      {key:'draft.response', surface:'Pre-Bid → AI Suggest', prompt:'Draft a formal AMC response to this query. Use formal third-person Indian government English. Cite the relevant tender clause where applicable. Do not invent terms not in the tender.'},
      {key:'rewrite.formal', surface:'Pre-Bid → Make more formal', prompt:'Rewrite the following response in more formal Indian government English. Preserve all factual content. Tighten where possible.'},
      {key:'summary.amendment', surface:'Pre-Bid → AI Amendment Summary', prompt:'Compare the original tender document with the responses. Identify any change that materially affects the bid: BOQ quantities, technical specs, dates, financial terms. For each, classify as "must push corrigendum" or "optional".'},
      {key:'parse.bid', surface:'Bid Evaluation → AI parser', prompt:'Parse the uploaded technical bid. Extract: turnover figures (from CA-signed certificate), work orders (value + year + client), ISO certifications (number + expiry), CMMI level, personnel CVs (count + roles).'},
      {key:'draft.award', surface:'Bid Mgmt → AI draft recommendation', prompt:'Draft an Award Recommendation Note based on the evaluation matrix. Be factual. State the awarded value in both ₹ and words. Cite the evaluation method and reasonableness verdict.'},
      {key:'edit.nit-section', surface:'Tender Creation → AI section edit', prompt:'Edit this NIT section. Use formal third-person Indian government English. Cite GFR 2017 and CVC guidelines where relevant. Keep clauses numbered.'},
      {key:'smart-start.describe', surface:'Tender Creation → AI describe (Smart Start)', prompt:'You are a procurement assistant for the Ahmedabad Municipal Corporation, helping an officer create a tender via natural language. Begin with a warm one-line greeting using their first name. Give two concrete example inputs drawn from common AMC procurement: one goods example and one works example (e.g. "I need 200 desktop computers for AMC offices" and "We need a contractor to repair roads in Bandra"). When the officer describes what they need, extract these fields and fill the form: Tender Type, Sub-Type, Sector, Suggested Evaluation Method, Estimated Value. If any field is ambiguous, ask one clarifying follow-up before filling it. Be especially careful with Estimated Value — if not stated, ask, do not guess. Use formal Indian government English with a helpful tone. Cite the AMC value tiers when discussing thresholds.'},
    ]},

/* =========================================================
   STATE
   ========================================================= */
const STORE_KEY = 'admin_state_v1';
const LOG_KEY   = 'admin_log_v1';

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){return{};} }
function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
function getValue(id){ const s=loadStore(); if(id in s) return s[id]; return ITEMS.find(i=>i.id===id)?.def; }
function setValue(id,v){ const s=loadStore(); s[id]=v; saveStore(s); logAction(id,v); refreshIcons(); }

function loadLog(){ try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){return[];} }
function saveLog(l){ localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(0,200))); }
function logAction(id, v){
  const item = ITEMS.find(i=>i.id===id);
  const log = loadLog();
  log.unshift({ id, title: (item?itemTitle(item):null)||id, who:'Rajesh Kumar', when:Date.now(), preview: summarise(v) });
  saveLog(log);
  renderActivity();
}
function summarise(v){
  if (v===true) return 'enabled';
  if (v===false) return 'disabled';
  if (Array.isArray(v)) return `${v.length} entries`;
  if (typeof v==='object'&& v) return 'updated';
  return String(v).slice(0,40);
}

/* =========================================================
   ICONS + TOAST
   ========================================================= */
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
let toastTimer;
function toast(msg){
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   SIDEBAR
   ========================================================= */
function renderSidebar(){
  const groups = {};
  SECTIONS.forEach(s => { (groups[s.g] = groups[s.g]||[]).push(s); });
  const cur = (location.hash||'#dashboard').slice(1);
  const html = Object.entries(groups).map(([g, items]) => `
    <div>
      <div class="text-[10.5px] tracking-[0.08em] text-ink-400 font-semibold px-3 mb-2">${g}</div>
      <ul class="space-y-0.5">
        ${items.map(it => {
          const active = it.k===cur;
          const count = ITEMS.filter(i=>i.m===it.k).length;
          const badge = count>0 ? `<span class="ml-auto text-[10px] font-semibold px-1.5 py-0.5 rounded-full ${active?'bg-white/20 text-white':'bg-surface text-ink-500 border border-line'}">${count}</span>` : '';
          return `<li><a href="#${it.k}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-[13.5px] ${active?'bg-primary text-white font-medium':'text-ink-500 hover:bg-surface hover:text-ink-900'}"><i data-lucide="${it.i}" class="w-4 h-4"></i> ${it.t} ${badge}</a></li>`;
        }).join('')}
      </ul>
    </div>
  `).join('');
  document.getElementById('sideNav').innerHTML = html + `<div class="pt-1"><a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-[13.5px] text-ink-500 hover:bg-surface hover:text-ink-900"><i data-lucide="arrow-left" class="w-4 h-4"></i> Procurement Portal</a></div>`;
  refreshIcons();
}

function itemTitle(item){ const m=item&&ROW_META[item.id]; return (m&&m.t)||(item&&item.title)||''; }
function itemContents(item){ const m=item&&ROW_META[item.id]; return (m&&m.c)||''; }
function itemSearchText(item){ const m=(item&&ROW_META[item.id])||{}; return (itemTitle(item)+' '+(item.title||'')+' '+(item.why||'')+' '+((m.k||[]).join(' '))+' '+(item.id||'')).toLowerCase(); }

/* ---- collapsible group state (per session) ---- */
const EXPAND_KEY = 'admin_expanded_v1';
function loadExpanded(){ try{ return JSON.parse(sessionStorage.getItem(EXPAND_KEY)||'{}'); }catch(e){ return {}; } }
function saveExpanded(o){ try{ sessionStorage.setItem(EXPAND_KEY, JSON.stringify(o)); }catch(e){} }
let expandedState = loadExpanded();

function stripGroupPrefix(s){ return String(s).replace(/^\s*\d+[A-Za-z]?\s*·\s*/, ''); }
function groupPrefixKey(s){ const p=String(s).split('·')[0].trim(); const m=/^(\d*)\s*([A-Za-z]*)/.exec(p)||[]; return [m[1]?parseInt(m[1],10):0, (m[2]||'')]; }
function groupNamesFor(key){
  const n=[]; ITEMS.filter(i=>i.m===key).forEach(i=>{ if(!n.includes(i.s)) n.push(i.s); });
  // order by subsection prefix (e.g. 3 · before 3A before 3B); committee (no letter) sorts first within its number
  return n.sort((a,b)=>{ const ka=groupPrefixKey(a), kb=groupPrefixKey(b); return ka[0]-kb[0] || ka[1].localeCompare(kb[1]); });
}
function groupIsCommittee(items){ return items.some(i=>i.t==='prebid-committee'); }
function isGroupExpanded(key,name,items){ const k=key+'::'+name; if(k in expandedState) return !!expandedState[k]; return groupIsCommittee(items); }
function toggleGroup(key,idx){
  const names=groupNamesFor(key); const name=names[idx];
  const items=ITEMS.filter(i=>i.m===key&&i.s===name);
  expandedState[key+'::'+name] = !isGroupExpanded(key,name,items);
  saveExpanded(expandedState);
  renderSection(key);
}
function setAllGroups(key,val){
  groupNamesFor(key).forEach(n=>{ expandedState[key+'::'+n]=val; });
  saveExpanded(expandedState);
  renderSection(key);
}

function renderSection(key){
  if (key==='dashboard') return renderDashboard();
  const sec = SECTIONS.find(s=>s.k===key);
  if (!sec) return renderDashboard();
  const all = ITEMS.filter(i=>i.m===key);
  const store = loadStore();
  const names = groupNamesFor(key);
  const groups = {};
  all.forEach(i=>{ (groups[i.s]=groups[i.s]||[]).push(i); });
  const matchFilter = (i) => {
    if (currentSearch && !itemSearchText(i).includes(currentSearch)) return false;
    return true;
  };
  const total = all.length;
  const grouped = total > 6;            // small sections stay flat
  const searching = !!currentSearch;

  let groupsHtml = '';
  if (!grouped){
    groupsHtml = names.map(g => {
      const items = groups[g].filter(matchFilter);
      if (!items.length) return '';
      return `
        <section class="sec-anchor space-y-3">
          <h3 class="text-[15px] font-semibold text-ink-900 mt-2">${escapeHtml(g)}</h3>
          <div class="space-y-2">${items.map(renderItemRow).join('')}</div>
        </section>`;
    }).join('');
  } else {
    groupsHtml = names.map((g, idx) => {
      const itemsAll = groups[g];
      const items = itemsAll.filter(matchFilter);
      if (searching && !items.length) return '';                 // hide non-matching groups while searching/filtering
      const expanded = searching ? true : isGroupExpanded(key, g, itemsAll);
      const custCount = itemsAll.filter(i => i.id in store).length;
      const shownCount = searching ? items.length : itemsAll.length;
      const isComm = groupIsCommittee(itemsAll);
      const header = `
        <button onclick="toggleGroup('${key}',${idx})" class="group w-full flex items-center gap-3 text-left bg-white border border-line rounded-xl px-4 py-3 hover:border-primary/30 transition">
          <i data-lucide="chevron-right" class="w-4 h-4 text-ink-400 shrink-0 transition-transform ${expanded?'rotate-90':''}"></i>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[14.5px] font-semibold text-ink-900">${escapeHtml(stripGroupPrefix(g))}</span>
              ${isComm ? '<span class="chip pri-Core">Committee</span>' : ''}
            </div>
            <p class="text-[12px] text-ink-500 mt-0.5 leading-snug max-w-2xl">${escapeHtml(CATEGORY_DESC[g]||'')}</p>
          </div>
          <span class="shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-surface text-ink-500 border border-line">${shownCount} item${shownCount===1?'':'s'}</span>
          ${custCount ? `<span class="shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-primary-light text-primary">${custCount} customised</span>` : ''}
        </button>`;
      const body = expanded ? `<div class="space-y-2 mt-2 mb-1 pl-1">${items.map(renderItemRow).join('')}</div>` : '';
      return `<section class="sec-anchor">${header}${body}</section>`;
    }).join('');
  }

  const expandBar = (grouped && !searching) ? `
      <div class="flex items-center justify-end gap-2">
        <button onclick="setAllGroups('${key}',true)" class="text-[12px] px-2.5 py-1 rounded-full border border-line hover:bg-surface text-ink-500">Expand all</button>
        <button onclick="setAllGroups('${key}',false)" class="text-[12px] px-2.5 py-1 rounded-full border border-line hover:bg-surface text-ink-500">Collapse all</button>
      </div>` : '';

  document.getElementById('content').innerHTML = `
    <div>
      <div class="text-[13px] text-ink-500 mb-2 flex items-center gap-2"><a href="#dashboard" class="hover:underline">Admin Console</a> · <span>${sec.g}</span></div>
      <h1 class="text-[24px] font-bold text-ink-900 leading-tight flex items-center gap-2.5"><span class="w-9 h-9 rounded-lg bg-primary-light text-primary flex items-center justify-center"><i data-lucide="${sec.i}" class="w-5 h-5"></i></span> ${sec.t}</h1>
      <p class="text-[14px] text-ink-500 mt-2 max-w-3xl">${sec.intro}</p>
    </div>

    ${expandBar ? `<div class="flex items-center">${expandBar}</div>` : ''}

    <div class="space-y-3">${groupsHtml || '<p class="text-[13px] text-ink-500 px-1">No settings match.</p>'}</div>
  `;
  refreshIcons();
  bindItemHandlers();
}

function renderItemRow(item){
  const val = getValue(item.id);
  const preview = renderPreview(item, val);
  const editable = renderInlineControl(item, val);
  return `
    <div class="item-row bg-white border border-line rounded-xl p-4" data-id="${item.id}">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
          <div class="text-[13px] font-semibold text-ink-900">${escapeHtml(itemTitle(item))}</div>
          ${itemContents(item) ? `<p class="text-[11.5px] text-ink-500 mt-0.5 leading-snug truncate max-w-2xl">${escapeHtml(itemContents(item))}</p>` : ''}
          ${preview ? `<div class="mt-2.5">${preview}</div>` : ''}
        </div>
        <div class="shrink-0 flex items-center gap-2">${editable}</div>
      </div>
    </div>
  `;
}

/* preview shows current value summary */
function renderPreview(item, val){
  switch(item.t){
    case 'list':
      if (!Array.isArray(val)) return '';
      return `<div class="flex flex-wrap gap-1.5">${val.slice(0,12).map(x => {
        const item = (typeof x === 'string') ? {label: x, enabled: true} : (x || {label:'', enabled:true});
        const enabled = item.enabled !== false;
        const cls = enabled ? '' : 'opacity-50 line-through';
        return `<span class="chip-input ${cls}">${escapeHtml(item.label)}</span>`;
      }).join('')}${val.length > 12 ? `<span class="text-[11px] text-ink-400">+${val.length-12} more</span>` : ''}</div>`;
    case 'kvlist':
      if (!Array.isArray(val)) return '';
      return `<div class="flex flex-wrap gap-1.5">${val.slice(0,6).map(p=>`<span class="chip-input"><b class="font-medium">${escapeHtml(p.k)}:</b>&nbsp;${escapeHtml(String(p.v))}</span>`).join('')}${val.length>6?`<span class="text-[11px] text-ink-400">+${val.length-6} more</span>`:''}</div>`;
    case 'tiers':
      return `<div class="flex flex-wrap gap-1.5">${val.map(t=>`<span class="chip-input">${fmtTier(t)} → ${escapeHtml(t.auth)}</span>`).join('')}</div>`;
    case 'chain':
      return `<div class="flex flex-wrap items-center gap-1">${val.map((x,i)=>`<span class="chip-input">${escapeHtml(x)}</span>${i<val.length-1?'<span class="text-ink-400 px-1">→</span>':''}`).join('')}</div>`;
    case 'matrix':

      return `<div class="text-[12px] text-ink-500">${val.rows.length} rows × ${val.cols.length} cols matrix</div>`;
    case 'lib':
      if (!Array.isArray(val)) return '';

    case 'template':

    case 'rules':
      if (!Array.isArray(val)) return '';
      return `<div class="text-[12px] text-ink-500">${val.length} rule(s)</div>`;
    case 'docbuilder':
      if (!Array.isArray(val)) return '';
      return `<div class="text-[12px] text-ink-500">${val.length} custom document${val.length===1?'':'s'}</div>`;
    case 'std-responses-library':

      const _live = val.filter(r => (r.status||'live') === 'live').length;

      if (!val || typeof val !== 'object') return '';
      const _gpc_presets = Array.isArray(val.presets) ? val.presets : (Array.isArray(val) ? val : []);
      const _gpc_access = Array.isArray(val.access) ? val.access : [];
      const _gpc_pEnabled = _gpc_presets.filter(p => (typeof p === 'string') ? true : p.enabled !== false).length;
      const _gpc_aEnabled = _gpc_access.filter(a => a.enabled !== false).length;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap">
        <span><strong class="text-ink-900">${_gpc_pEnabled}</strong> preset${_gpc_pEnabled!==1?'s':''} active</span>
        <span class="text-ink-300">•</span>
        <span><strong class="text-ink-900">${_gpc_aEnabled}</strong> role${_gpc_aEnabled!==1?'s':''} can add</span>

    case 'prebid-dates':
      if (!val || typeof val !== 'object') return '';
      const _pbd_t = Array.isArray(val.tenders) ? val.tenders : [];
      const _pbd_active = _pbd_t.filter(t => t.status === 'Active').length;
      const _pbd_locked = _pbd_t.filter(t => t.status === 'Published' || t.status === 'Closed').length;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap">
        <span><strong class="text-ink-900">${_pbd_t.length}</strong> tenders</span>
        <span class="text-ink-300">•</span>

        <span class="text-ink-300">•</span>
        <span>${_pbd_locked} locked</span>
      </div>`;
    case 'prebid-committee':
      if (!val || typeof val !== 'object') return '';
      const _pbc_m = Array.isArray(val.members)      ? val.members.length : 0;
      const _pbc_d = Array.isArray(val.designations) ? val.designations.filter(d=>d.enabled!==false).length : 0;
      const _pbc_a = Array.isArray(val.actions)      ? val.actions.filter(a=>a.enabled!==false).length : 0;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap">
        <span><strong class="text-ink-900">${_pbc_m}</strong> member${_pbc_m!==1?'s':''}</span>
        <span class="text-ink-300">•</span>
        <span><strong class="text-ink-900">${_pbc_d}</strong> designation${_pbc_d!==1?'s':''}</span>
        <span class="text-ink-300">•</span>
        <span><strong class="text-ink-900">${_pbc_a}</strong> action${_pbc_a!==1?'s':''}</span>

    case 'ai-touchpoints': {
      if (!val || typeof val !== 'object') return '';
      if (!val.master) return `<div class="text-[12px] text-ink-500 flex items-center gap-2"><span class="chip pri-Helpful">Master OFF</span> all AI assistance suppressed</div>`;
      const _tps = Array.isArray(val.touchpoints) ? val.touchpoints : [];
      const _pro = _tps.filter(t => t.kind!=='check' && t.mode==='proactive').length;
      const _od  = _tps.filter(t => t.kind!=='check' && t.mode==='ondemand').length;
      const _off = _tps.filter(t => t.mode==='off').length;
      const _restr = _tps.filter(t => t.restrict && (t.restrict.sensitive || t.restrict.maxValue)).length;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap">
        <span><strong class="text-ink-900">${_pro}</strong> proactive</span><span class="text-ink-300">•</span>
        <span><strong class="text-ink-900">${_od}</strong> on-demand</span><span class="text-ink-300">•</span>
        <span><strong class="text-ink-900">${_off}</strong> off</span>

      if (!Array.isArray(val)) return '';

    case 'tender-tree': {
      if (!Array.isArray(val)) return '';
      let nodes=0, leaves=0; const walk=a=>a.forEach(n=>{ nodes++; if(n.children&&n.children.length) walk(n.children); else leaves++; });

    case 'tender-manual-just':
      if (!val || typeof val !== 'object') return '';

    }
    case 'submission-gates': {
      if (!val || typeof val !== 'object') return '';

    case 'methods-suite': {
      if (!val || typeof val !== 'object') return '';

    case 'tender-structure': {
      if (!val || typeof val !== 'object') return '';

      const _ts_on = ['allowResubmission','allowWithdrawal','allowOffline'].filter(k=>_ts_sub[k]&&_ts_sub[k].on).length;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap"><span><strong class="text-ink-900">${(val.covers&&val.covers.options||[]).length}</strong> cover options</span><span class="text-ink-300">•</span><span>${_ts_on}/3 submission switches on</span><span class="text-ink-300">•</span><span>${(val.bidValidity&&val.bidValidity.presets||[]).length} validity presets</span></div>`;

      const _ne_esc = _ne.filter(e=>e.escalation).length;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap"><span><strong class="text-ink-900">${_ne.length}</strong> events configured</span><span class="text-ink-300">•</span><span>${_ne_esc} with escalation</span></div>`;
    }
    case 'corrigendum-gepnic': {
      if (!val || typeof val !== 'object') return '';
      const _cg_on = (val.types||[]).filter(t=>t.enabled!==false).length;
      return `<div class="flex items-center gap-3 text-[12px] text-ink-500 flex-wrap"><span><strong class="text-ink-900">${_cg_on}</strong> of ${(val.types||[]).length} corrigendum types on</span><span class="text-ink-300">•</span><span>${(val.autoDraftTriggers||[]).length} auto-draft triggers</span>${val.autoExtend?`<span class="text-ink-300">•</span><span>+${val.extensionDays||0}d auto-extend</span>`:''}</div>`;
    }
    case 'criterion-builder': {
      if (!Array.isArray(val)) return '';
      const act = val.filter(c=>c.active!==false).length;
      return `<div class="text-[12px] text-ink-500"><strong class="text-ink-900">${val.length}</strong> criteria · ${act} active</div>`;
    }
    case 'tq-rubric': {
      if (!val || typeof val !== 'object') return '';
      const groups = Array.isArray(val.groups) ? val.groups : [];
      const crit = groups.reduce((n,g)=>n+((g.criteria||[]).length),0);
      const total = groups.reduce((n,g)=>n+(g.criteria||[]).reduce((m,c)=>m+(Number(c.max)||0),0),0);
      const ok = total===100;
      return `<div class="flex items-center gap-2 text-[12px] text-ink-500 flex-wrap">
        <span>${crit} criteria · ${groups.length} groups · ${(val.overrides||[]).length} sector override${(val.overrides||[]).length===1?'':'s'}</span>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${ok?'bg-success/10 text-success':'bg-danger/10 text-danger'}">Total ${total}/100</span>
        ${ok?'':'<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-danger text-white">Total ≠ 100</span>'}
      </div>`;
    }
    case 'milestones-matrix':
      if (!Array.isArray(val)) return '';
      return `<div class="text-[12px] text-ink-500"><strong class="text-ink-900">${val.length}</strong> milestones · ${val.filter(m=>m.required).length} required</div>`;
    case 'corrigendum-policy':
      if (!val || typeof val !== 'object') return '';
      return `<div class="text-[12px] text-ink-500">${(val.mandatoryTriggers||[]).length} mandatory · ${(val.optionalTriggers||[]).length} optional${val.autoExtendsTimeline?` · +${val.extensionDays||0}d`:''}</div>`;
    case 'publish-gates': {
      if (!Array.isArray(val)) return '';
      const blk = val.filter(g=>g.blocking).length;
      return `<div class="text-[12px] text-ink-500"><strong class="text-ink-900">${val.length}</strong> gates · ${blk} blocking</div>`;
    }
    case 'withdrawal-policy':
      if (!val || typeof val !== 'object') return '';
      return `<div class="text-[12px] text-ink-500">${(val.allowedStages||[]).length} stages · refund: ${escapeHtml(val.emdRefundOnWithdrawal||'—')}</div>`;
    default: return '';
  }
}

function fmtTier(t){
  const lo = inrCompact(t.min);
  const hi = t.max==null?'∞':inrCompact(t.max);
  return `${lo}–${hi}`;
}
function inrCompact(n){
  if (n==null) return '∞';
  if (n>=10000000) return '₹'+(n/10000000).toFixed(n%10000000?1:0)+'Cr';
  if (n>=100000)   return '₹'+(n/100000).toFixed(n%100000?1:0)+'L';
  if (n>=1000)     return '₹'+(n/1000).toFixed(0)+'k';
  return '₹'+n;
}

/* inline controls */
function renderInlineControl(item, val){
  switch(item.t){
    case 'toggle':
      return `<button class="toggle ${val?'on':''}" data-act="toggle" data-id="${item.id}" aria-pressed="${val?'true':'false'}"><span class="dot"></span></button>`;
    case 'number':
      return `<div class="flex items-center gap-2"><input class="inp w-24 text-right" type="number" value="${escapeHtml(String(val))}" data-act="number" data-id="${item.id}"><span class="text-[12px] text-ink-500">${escapeHtml(item.unit||'')}</span></div>`;
    case 'percent':
      return `<div class="flex items-center gap-2"><input class="inp w-20 text-right" type="number" min="0" max="100" value="${escapeHtml(String(val))}" data-act="number" data-id="${item.id}"><span class="text-[12px] text-ink-500">%</span></div>`;
    case 'text':
      return `<input class="inp w-72" type="text" value="${escapeHtml(String(val||''))}" data-act="text" data-id="${item.id}">`;
    case 'select':
      return `<select class="inp" data-act="select" data-id="${item.id}">${(item.options||[]).map(o=>`<option ${o===val?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;
    case 'docbuilder':
      return `<button class="btn" data-act="docbuilder" data-id="${item.id}"><i data-lucide="settings-2" class="w-3.5 h-3.5"></i> Configure</button>`;
    default:
      return `<button class="btn" data-act="open" data-id="${item.id}"><i data-lucide="settings-2" class="w-3.5 h-3.5"></i> Configure</button>`;
  }
}

function bindItemHandlers(){
  document.querySelectorAll('[data-act="toggle"]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id; const next = !getValue(id);
      setValue(id, next);
      el.classList.toggle('on', next);
      el.setAttribute('aria-pressed', String(next));
      toast(`${itemTitle(ITEMS.find(i=>i.id===id))}: ${next?'enabled':'disabled'}`);
    };
  });
  document.querySelectorAll('[data-act="number"]').forEach(el => {
    el.onchange = () => { setValue(el.dataset.id, Number(el.value)); toast('Saved'); };
  });
  document.querySelectorAll('[data-act="text"]').forEach(el => {
    el.onchange = () => { setValue(el.dataset.id, el.value); toast('Saved'); };
  });
  document.querySelectorAll('[data-act="select"]').forEach(el => {
    el.onchange = () => { setValue(el.dataset.id, el.value); toast('Saved'); };
  });
  document.querySelectorAll('[data-act="open"]').forEach(el => {
    el.onclick = () => openEdit(el.dataset.id);
  });
  document.querySelectorAll('[data-act="docbuilder"]').forEach(el => {
    el.onclick = () => openDocBuilder();
  });
}

/* =========================================================
   EDIT PANEL (complex types: list, kvlist, lib, chain, matrix, tiers, template)
   ========================================================= */
let editingId = null;
let editingDraft = null;

function openEdit(id){
  editingId = id;
  const item = ITEMS.find(i=>i.id===id);
  editingDraft = JSON.parse(JSON.stringify(getValue(id)));
  document.getElementById('epSection').textContent = item.s;
  document.getElementById('epTitle').textContent = itemTitle(item);
  document.getElementById('epWhy').textContent = item.why;
  document.getElementById('epBody').innerHTML = renderEditor(item, editingDraft);
  // Wider panel for the permissions matrix and the merged multi-section editors.
  document.getElementById('editPanel').style.width =
    (item.t === 'prebid-committee' || item.t === 'tender-tree') ? '1080px'
    : (['methods-suite','notif-events','corrigendum-gepnic','tender-structure','tq-rubric','ai-touchpoints','logo-library','submission-gates'].includes(item.t)) ? '980px'
    : '';
  document.getElementById('editPanel').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
  refreshIcons();
  bindEditorHandlers();
}
function closeEdit(){
  document.getElementById('editPanel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('editPanel').style.width = '';
  editingId = null;
}
function saveEdit(){
  if (editingId==null) return;
  setValue(editingId, editingDraft);
  const item = ITEMS.find(i=>i.id===editingId);
  toast(`${itemTitle(item)} saved`);
  closeEdit();
  renderSection((location.hash||'#dashboard').slice(1));
}
document.getElementById('backdrop').addEventListener('click', closeEdit);

function renderEditor(item, draft){
  switch(item.t){
    case 'list':    return editorList(draft);

/* list editor */
function renderListRows(){
  const c = document.getElementById('listRows');
  // Normalize editingDraft to {label, enabled} format (backward compatible)
  editingDraft = (editingDraft||[]).map(normalizeListItem);

  c.innerHTML = editingDraft.map((item, i) => `
    <div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${!item.enabled ? 'bg-surface' : 'bg-white'}">
      <button class="toggle ${item.enabled ? 'on' : ''}" data-toggle="${i}" aria-pressed="${item.enabled ? 'true' : 'false'}" aria-label="Enable or disable this entry"><span class="dot"></span></button>
      <input type="text" class="flex-1 bg-transparent text-[13px] ${!item.enabled ? 'line-through text-ink-400' : 'text-ink-900'} focus:outline-none focus:ring-0 border-0 p-0" data-label="${i}" value="${escapeHtml(item.label)}" />
      <button data-rm="${i}" class="text-ink-400 hover:text-danger transition" aria-label="Remove this entry"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
  `).join('');

  c.querySelectorAll('button[data-toggle]').forEach(b => b.onclick = () => {
    const i = +b.dataset.toggle;
    editingDraft[i].enabled = !editingDraft[i].enabled;
    renderListRows();
  });
  c.querySelectorAll('input[data-label]').forEach(inp => {
    inp.oninput = e => { editingDraft[+e.target.dataset.label].label = e.target.value; };
  });
  c.querySelectorAll('button[data-rm]').forEach(b => b.onclick = () => {
    editingDraft.splice(+b.dataset.rm, 1);
    renderListRows();
  });

  const input = document.getElementById('newListItem');
  if (input) input.onkeydown = e => { if (e.key === 'Enter') { addListEntry(); e.preventDefault(); } };
  refreshIcons();
}
function addListEntry(){
  const i = document.getElementById('newListItem');
  const v = i.value.trim();
  if (!v) return;
  editingDraft = editingDraft || [];
  editingDraft.push({label: v, enabled: true});
  i.value = '';
  renderListRows();
}

/* kv editor */
// A kvlist value is boolean-ish when it reads true/false (string or real boolean).
function kvIsBool(v){ return v===true || v===false || v==='true' || v==='false' || v==='True' || v==='False'; }
function kvBoolVal(v){ return v===true || v==='true' || v==='True'; }

function renderKvRows(){
  const c = document.getElementById('kvRows');
  c.innerHTML = (editingDraft||[]).map((p,i)=>{
    const bool = kvIsBool(p.v);
    const on = kvBoolVal(p.v);
    const valControl = bool
      ? `<button class="toggle ${on?'on':''}" data-toggle="${i}" aria-pressed="${on?'true':'false'}" aria-label="Toggle value"><span class="dot"></span></button>`
      : `<input class="inp flex-1" data-i="${i}" data-k="v" value="${escapeHtml(String(p.v||''))}" placeholder="Value">`;
    return `
    <div class="flex items-center gap-2 ${bool && !on ? 'opacity-70' : ''}">
      <input class="inp flex-1" data-i="${i}" data-k="k" value="${escapeHtml(p.k||'')}" placeholder="Key">
      ${valControl}
      <button class="btn btn-danger" data-i="${i}" aria-label="Remove"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
    </div>`;
  }).join('');
  c.querySelectorAll('input').forEach(inp => inp.onchange = e => { editingDraft[+e.target.dataset.i][e.target.dataset.k] = e.target.value; });
  c.querySelectorAll('button[data-toggle]').forEach(b => b.onclick = () => {
    const i = +b.dataset.toggle;
    const cur = editingDraft[i].v;
    const next = !kvBoolVal(cur);
    editingDraft[i].v = (typeof cur === 'boolean') ? next : (next ? 'true' : 'false');
    renderKvRows();
  });
  c.querySelectorAll('button[aria-label="Remove"]').forEach(b => b.onclick = () => { editingDraft.splice(+b.dataset.i,1); renderKvRows(); });
  refreshIcons();
}
function addKvEntry(){ editingDraft = editingDraft||[]; editingDraft.push({k:'',v:''}); renderKvRows(); }

/* ===== AI assistance — central touchpoint control (tender.ai-touchpoints) ===== */
let aitUI = {restrict:{}, sectionsOpen:false};
function aitFmtMoney(n){ n=Number(n)||0; if(!n) return ''; if(n>=10000000) return '₹'+(n/10000000).toFixed(n%10000000?2:0)+' Cr'; if(n>=100000) return '₹'+(n/100000).toFixed(n%100000?1:0)+' L'; return '₹'+n.toLocaleString('en-IN'); }
// Section names synced (read-only) from the NIT section structure item.
function aitNitSections(){ const raw=getValue('tender.nit-sections')||[]; return (Array.isArray(raw)?raw:[]).map(normalizeListItem).filter(s=>s.enabled!==false).map(s=>s.label); }
// One source of truth for "is AI drafting allowed for this section": the touchpoints item.
function aitSectionDrafting(){ const v=getValue('tender.ai-touchpoints'); return (v && v.sectionDrafting) || {}; }
function editorAiTouchpoints(draft){ aitUI={restrict:{}, sectionsOpen:false}; return `<div id="aitRoot"></div>`; }
function renderAiTouchpointsAll(){
  if (!editingDraft || typeof editingDraft!=='object' || Array.isArray(editingDraft)) {
    const _it = ITEMS.find(i=>i.id===editingId) || ITEMS.find(i=>i.id==='tender.ai-touchpoints');
    editingDraft = JSON.parse(JSON.stringify(_it.def));
  }
  const draft = editingDraft;
  draft.touchpoints = draft.touchpoints || [];
  draft.sectionDrafting = draft.sectionDrafting || {};
  const masterOn = !!draft.master;
  const root = document.getElementById('aitRoot');
  // Module-aware cross-reference for the Review checks' "where blocking lives" caption.
  const _gatesCaption = String(editingId||'').startsWith('dpr.')
    ? 'set in Submission gates &amp; policies → Pre-submission gates (AA/TS), not here.'
    : 'set in Review &amp; publish → Pre-publish hard gates, not here.';

  const sectionSubList = () => {
    const secs = aitNitSections();
    const enabled = secs.filter(s => draft.sectionDrafting[s] !== false).length;
    const open = aitUI.sectionsOpen;
    return `<div class="mt-2.5 pt-2.5 border-t border-line">
      <button id="aitSecToggle" class="text-[11.5px] font-medium text-ink-500 inline-flex items-center gap-1.5">
        <i data-lucide="list-tree" class="w-3.5 h-3.5"></i> Per section (${enabled}/${secs.length} allow AI)
        <i data-lucide="chevron-${open?'up':'down'}" class="w-3.5 h-3.5"></i>
      </button>
      ${open ? `<div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-1.5">
        ${secs.map(s => { const on = draft.sectionDrafting[s] !== false; return `
          <label class="flex items-center gap-2 text-[12px] px-2.5 py-1.5 border border-line rounded-lg ${on?'bg-white':'bg-surface'}">
            <button class="toggle ${on?'on':''}" data-sec-draft="${escapeHtml(s)}" aria-pressed="${on}"><span class="dot"></span></button>
            <span class="${on?'text-ink-900':'text-ink-400 line-through'}">${escapeHtml(s)}</span>
          </label>`; }).join('')}
      </div>
      <p class="text-[11px] text-ink-400 italic mt-1.5">Synced from NIT section structure. Turn AI off where legal wants human-only text (e.g. General conditions, Eligibility).</p>` : ''}
    </div>`;
  };

  const rowHtml = (tp) => {
    const isCheck = tp.kind==='check';
    const r = tp.restrict || {};
    const rActive = !!(r.sensitive || r.maxValue);
    const rOpen = !!aitUI.restrict[tp.id];
    const seg = isCheck
      ? `<div class="inline-flex rounded-lg border border-line overflow-hidden text-[12px] shrink-0">
           <button data-mode="${tp.id}|on"  class="px-3 py-1.5 ${tp.mode==='on' ?'bg-primary text-white':'bg-white text-ink-500 hover:bg-surface'}">On</button>
           <button data-mode="${tp.id}|off" class="px-3 py-1.5 border-l border-line ${tp.mode==='off'?'bg-ink-900 text-white':'bg-white text-ink-500 hover:bg-surface'}">Off</button>
         </div>`
      : `<div class="inline-flex rounded-lg border border-line overflow-hidden text-[12px] shrink-0">
           ${[['proactive','Proactive'],['ondemand','On-demand'],['off','Off']].map(([v,l],idx)=>`<button data-mode="${tp.id}|${v}" class="px-3 py-1.5 ${idx?'border-l border-line ':''}${tp.mode===v?(v==='off'?'bg-ink-900 text-white':'bg-primary text-white'):'bg-white text-ink-500 hover:bg-surface'}">${l}</button>`).join('')}
         </div>`;
    return `<div class="rounded-xl border border-line bg-white px-4 py-3">
      <div class="flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <div class="text-[13.5px] font-semibold text-ink-900">${escapeHtml(tp.name)}</div>
          <p class="text-[12px] text-ink-500 mt-0.5 leading-snug">${escapeHtml(tp.desc)}</p>
          ${tp.smartStartRef ? `<p class="text-[11px] text-ink-400 mt-1 italic">Precedence: this and the Smart Start methods matrix must <em>both</em> allow it — if either is off, the describe entry is hidden.</p>` : ''}
          ${isCheck ? `<p class="text-[11px] text-ink-400 mt-1 italic">On/Off controls visibility only. Whether this check blocks submission is ${_gatesCaption}</p>` : ''}
        </div>
        ${seg}
      </div>
      ${tp.hasSections ? sectionSubList() : ''}
      <div class="mt-2 pt-2 border-t border-line">
        <button data-restrict-toggle="${tp.id}" class="text-[11.5px] font-medium text-ink-500 inline-flex items-center gap-1.5">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i> Restrict
          ${rActive ? `<span class="chip pri-Core ml-0.5">${[r.sensitive?'sensitive':'', r.maxValue?('> '+aitFmtMoney(r.maxValue)):''].filter(Boolean).join(' · ')}</span>` : ''}
          <i data-lucide="chevron-${rOpen?'up':'down'}" class="w-3.5 h-3.5"></i>
        </button>
        ${rOpen ? `<div class="mt-2 space-y-2 pl-1">
          <div class="flex items-center gap-2 text-[12px] text-ink-700">
            <button class="toggle ${r.sensitive?'on':''}" data-restrict-sens="${tp.id}" aria-pressed="${!!r.sensitive}"><span class="dot"></span></button>
            <span>Disable for sensitive / vigilance-flagged tenders</span>
          </div>
          <div class="flex items-center gap-2 text-[12px] text-ink-700">
            <span>Disable above</span>
            <input class="inp w-40" inputmode="numeric" placeholder="No limit (₹)" data-restrict-max="${tp.id}" value="${r.maxValue?escapeHtml(String(r.maxValue)):''}">
            <span class="text-ink-400">${r.maxValue?aitFmtMoney(r.maxValue):'blank = no limit'}</span>
          </div>
          <p class="text-[11px] text-ink-400 italic">High-value and sensitive tenders need a fully human-attributable drafting trail.</p>
        </div>` : ''}
      </div>
    </div>`;
  };

  const stageBlock = (stage) => {
    const rows = draft.touchpoints.filter(t => t.stage===stage);
    if (!rows.length) return '';
    return `<div class="mb-5">
      <div class="text-[11px] font-semibold uppercase tracking-wide text-ink-400 mb-2">${stage} stage</div>
      <div class="space-y-2">${rows.map(rowHtml).join('')}</div>
    </div>`;
  };

  root.innerHTML = `
    <div class="space-y-5">
      <div class="flex items-start gap-3 p-4 rounded-xl border ${masterOn?'border-primary/40 bg-primary-light/40':'border-line bg-surface'}">
        <button class="toggle ${masterOn?'on':''}" id="aitMaster" aria-pressed="${masterOn}"><span class="dot"></span></button>
        <div class="flex-1 min-w-0">

    root.querySelectorAll('[data-restrict-max]').forEach(inp => inp.onchange = e => { const id=e.target.dataset.restrictMax; const tp=draft.touchpoints.find(t=>t.id===id); if(tp){ tp.restrict=tp.restrict||{}; const n=parseInt(String(e.target.value).replace(/[^0-9]/g,''),10); tp.restrict.maxValue=(n>0)?n:null; renderAiTouchpointsAll(); } });

  }

/* ===== AI section-edit prompts (tender.ai-section-prompts) — names synced from NIT sections ===== */
function aitAutosize(ta){ ta.style.height='auto'; const lh=parseFloat(getComputedStyle(ta).lineHeight)||18; const max=lh*10+16; ta.style.height=Math.min(ta.scrollHeight, max)+'px'; ta.style.overflowY = ta.scrollHeight>max ? 'auto' : 'hidden'; }
function editorSectionPrompts(draft){ return `<div id="spRoot"></div>`; }
function renderSectionPromptsAll(){
  editingDraft = Array.isArray(editingDraft) ? editingDraft : [];
  const draft = editingDraft;
  const root = document.getElementById('spRoot');
  const secs = aitNitSections();                       // authoritative, ordered, read-only names
  const secDraft = aitSectionDrafting();               // cross-reference: AI on/off per section
  const aiOff = s => secDraft[s] === false;
  const have = new Set(draft.map(p => p.k));
  const rowsBySec = {}; draft.forEach(p => { rowsBySec[p.k] = p; });
  const visible = secs.filter(s => have.has(s));        // section removed from NIT sections → row hides, data retained
  const missing = secs.filter(s => !have.has(s));       // promptless sections only

  root.innerHTML = `
    <div class="space-y-3">
      <div id="spRows" class="space-y-3"></div>
      <div class="pt-3 border-t border-line">
        ${missing.length
          ? `<div class="flex items-center gap-2">
               <select id="spAddSel" class="inp flex-1">${missing.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select>
               <button class="btn btn-primary" id="spAddBtn"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add prompt</button>
             </div>`
          : `<div class="text-[12px] text-ink-400 italic">Every NIT section has a prompt.</div>`}
        <p class="text-[11px] text-ink-400 mt-1.5">Section names are managed in NIT section structure and are read-only here. “Add prompt” only lists sections that don’t have one yet.</p>
      </div>
    </div>`;

  const rowsEl = root.querySelector('#spRows');
  rowsEl.innerHTML = visible.map(s => {
    const p = rowsBySec[s]; const off = aiOff(s);
    return `<div class="rounded-xl border border-line ${off?'bg-surface opacity-80':'bg-white'} px-3.5 py-3">
      <div class="flex items-center justify-between mb-1.5">
        <div class="text-[13px] font-semibold text-ink-900 flex items-center gap-2">${escapeHtml(s)}${off?'<span class="chip pri-Helpful">AI off</span>':''}</div>
        <button data-sp-rm="${escapeHtml(s)}" class="text-ink-400 hover:text-danger transition" aria-label="Remove prompt"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
      ${off ? `<p class="text-[11px] text-warning mb-1.5">AI drafting disabled for this section in AI assistance settings.</p>` : ''}
      <textarea data-sp-prompt="${escapeHtml(s)}" rows="3" class="inp w-full text-[12.5px] leading-relaxed" placeholder="Drafting instruction for this section…">${escapeHtml(String(p.v||''))}</textarea>
    </div>`;
  }).join('') || `<div class="text-center py-6 text-ink-400 text-[13px] border border-dashed border-line rounded-xl">No section prompts yet. Use “Add prompt” below.</div>`;

/* ---- EMD policy (percentage of EC + MSME exemption only) ---- */
function emdFromKv(arr){
  const find=k=>{ const p=(arr||[]).find(x=>x && String(x.k||'').toLowerCase().includes(k)); return p?p.v:undefined; };
  const truthy=v=>v===true||v==='true'||v==='True';
  const pctRaw=find('emd %')!=null?find('emd %'):find('%');
  const pct=parseFloat(pctRaw);
  const micro=find('micro'), small=find('small');
  const exempt=(micro===undefined && small===undefined) ? true : (truthy(micro)||truthy(small));
  return { percent:isNaN(pct)?2:pct, msmeExempt:exempt };
}

/* ---- logo & seal image library (real uploads, usage tags, one default per tag) ---- */
const LL_TAGS=['Header logo','Official seal','Watermark','Footer emblem','DPR header logo','DPR cover seal'];
const LL_MAX_BYTES=307200;     // ~300 KB per image
const LL_BUDGET=4500000;       // ~4.5 MB total serialized budget for this item
let llMode='new', llIdx=null;
// Build a seeded asset from an inline SVG (used in the item def; function declaration hoists).
function sigSampleLogo(id,name,tag,isDefault,w,h,svg){ const dataUrl='data:image/svg+xml,'+encodeURIComponent(svg); return {id, name, tag, isDefault, seeded:true, image:{name:id+'.svg', type:'image/svg+xml', dataUrl, width:w, height:h, size:svg.length}}; }
function llFmtSize(n){ n=Number(n)||0; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return Math.round(n/1024)+' KB'; return n+' B'; }
function llOverBudget(){ try{ return JSON.stringify(editingDraft).length > LL_BUDGET; }catch(e){ return true; } }
function llReadImage(file, cb){
  if(!/image\/(png|jpeg|jpg|svg\+xml)/i.test(file.type||'')){ cb({error:'type'}); return; }
  if(file.size > LL_MAX_BYTES){ cb({error:'size'}); return; }
  const r=new FileReader();
  r.onload=()=>{
    const dataUrl=r.result;
    const done=(w,h)=>cb({image:{name:file.name, type:file.type, dataUrl, width:w||null, height:h||null, size:file.size}});
    try{ const img=new Image(); img.onload=()=>done(img.naturalWidth||img.width, img.naturalHeight||img.height); img.onerror=()=>done(null,null); img.src=dataUrl; }
    catch(e){ done(null,null); }
  };
  r.onerror=()=>cb({error:'read'});
  r.readAsDataURL(file);
}
function llApplyUpload(mode, idx, file){
  llReadImage(file, res=>{
    if(res.error==='type'){ toast('Only PNG, JPG or SVG images are allowed.'); return; }
    if(res.error==='size'){ toast('Image too large ('+llFmtSize(file.size)+'). Max 300 KB — please compress and retry.'); return; }
    if(res.error){ toast('Could not read that image.'); return; }
    if(mode==='replace'){
      const a=editingDraft[idx]; if(!a) return; const prev=a.image, prevName=a.name;
      a.image=res.image;
      if(llOverBudget()){ a.image=prev; toast('Storage budget exceeded — image not saved. Try a smaller file.'); renderLogoLibraryAll(); return; }
      toast('Replaced “'+a.name+'”');
    } else {
      const tag='Header logo';
      const hasDef=editingDraft.some(x=>x.tag===tag && x.isDefault);
      const a={id:'logo_'+Date.now().toString(36), name:(file.name||'logo').replace(/\.[^.]+$/,''), tag, isDefault:!hasDef, seeded:false, image:res.image};
      editingDraft.push(a);
      if(llOverBudget()){ editingDraft.pop(); toast('Storage budget exceeded — image not saved. Try a smaller file.'); renderLogoLibraryAll(); return; }
      toast('Logo added');
    }
    renderLogoLibraryAll();
  });
}
function llSetDefault(i){ const a=editingDraft[i]; if(!a) return; editingDraft.forEach(x=>{ if(x.tag===a.tag) x.isDefault=false; }); a.isDefault=true; renderLogoLibraryAll(); }
function llChangeTag(i, newTag){
  const a=editingDraft[i]; if(!a) return; const oldTag=a.tag; a.tag=newTag;
  const newHasDefault=editingDraft.some((x,j)=>j!==i && x.tag===newTag && x.isDefault);
  a.isDefault=!newHasDefault;
  if(oldTag!==newTag){ const oldAssets=editingDraft.filter(x=>x.tag===oldTag); if(oldAssets.length && !oldAssets.some(x=>x.isDefault)) oldAssets[0].isDefault=true; }
  renderLogoLibraryAll();
}
function llDelete(i){
  const a=editingDraft[i]; if(!a) return;
  const msg='Delete “'+a.name+'”'+(a.isDefault?' — the current default for '+a.tag+'. A new default will be picked.':'')+'?';
  if(typeof window.confirm==='function' && !window.confirm(msg)) return;
  const tag=a.tag, wasDefault=a.isDefault;
  editingDraft.splice(i,1);
  if(wasDefault){ const repl=editingDraft.find(x=>x.tag===tag); if(repl){ repl.isDefault=true; toast('New default for '+tag+': '+repl.name); } }
  renderLogoLibraryAll();
}
function llDownload(i){ const a=editingDraft[i]; if(!a||!a.image||!a.image.dataUrl) return; const link=document.createElement('a'); link.href=a.image.dataUrl; link.download=a.image.name||((a.name||'logo')+'.png'); document.body.appendChild(link); link.click(); link.remove(); }
function llTriggerFile(mode, idx){ llMode=mode; llIdx=idx; const fi=document.getElementById('llFile'); if(fi){ fi.value=''; fi.click(); } }
function editorLogoLibrary(){ return `
  <div class="space-y-3">
    <div class="text-[11.5px] text-ink-500 leading-snug">Real image assets used on outgoing documents. The portal reads the <b>default</b> asset per usage tag — <code class="text-[11px] bg-surface px-1 rounded">AdminState.logo('Header logo')</code> returns its <code class="text-[11px] bg-surface px-1 rounded">image.dataUrl</code>. PNG / JPG / SVG, ≤ 300 KB each.</div>
    <div id="llDrop" class="border-2 border-dashed border-line rounded-xl p-3 transition">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="text-[12px] text-ink-500">Drag &amp; drop an image here, or</div>
        <button class="btn btn-primary" id="llUpload"><i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload logo</button>
      </div>
      <div id="llGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>
    <input type="file" id="llFile" accept="image/png,image/jpeg,image/svg+xml" class="hidden">
  </div>`; }
function renderLogoLibraryAll(){
  if(!Array.isArray(editingDraft)) editingDraft=[];
  editingDraft.forEach(a=>{ if(!a.tag||!LL_TAGS.includes(a.tag)) a.tag='Header logo'; if(!a.image) a.image={}; });
  // Enforce exactly one default per tag that has assets.
  LL_TAGS.forEach(tag=>{ const assets=editingDraft.filter(a=>a.tag===tag); if(assets.length){ const defs=assets.filter(a=>a.isDefault); if(defs.length===0) assets[0].isDefault=true; else if(defs.length>1) defs.slice(1).forEach(a=>a.isDefault=false); } });
  const grid=document.getElementById('llGrid');
  grid.innerHTML = editingDraft.length ? editingDraft.map((a,i)=>{
    const img=a.image||{};
    const dims=(img.width&&img.height)?`${img.width}×${img.height}`:'—';
    return `<div class="group relative border border-line rounded-xl p-3 bg-white">
      <div class="flex items-center justify-center rounded-lg bg-surface mb-2 overflow-hidden" style="height:96px">
        ${img.dataUrl?`<img src="${img.dataUrl}" alt="${escapeHtml(a.name||'')}" style="max-height:88px;max-width:100%;object-fit:contain">`:`<span class="text-[11px] text-ink-400">No image</span>`}
      </div>
      <input class="inp w-full text-[12.5px] font-medium mb-1.5" data-ll-name="${i}" value="${escapeHtml(a.name||'')}">
      <div class="flex items-center gap-2">
        <select class="inp flex-1 text-[12px]" data-ll-tag="${i}">${LL_TAGS.map(t=>`<option ${a.tag===t?'selected':''}>${t}</option>`).join('')}</select>
        <button data-ll-default="${i}" title="${a.isDefault?'Default for '+a.tag:'Make default for '+a.tag}" style="font-size:18px;line-height:1;color:${a.isDefault?'#F59E0B':'#CBD5E1'}">${a.isDefault?'★':'☆'}</button>
      </div>
      <div class="flex items-center gap-2 mt-1.5 text-[10.5px] text-ink-400 flex-wrap">
        <span>${escapeHtml((img.type||'').replace('image/','').toUpperCase())||'—'}</span><span>·</span><span>${dims}</span><span>·</span><span>${img.size?llFmtSize(img.size):'—'}</span>
        ${a.seeded?'<span class="chip" style="background:#EEEDFE;color:#8B5CF6">seeded</span>':''}
        ${a.isDefault?`<span class="chip" style="background:#EFF6FF;color:#0F5EE8">default · ${escapeHtml(a.tag)}</span>`:''}
      </div>
      <div class="absolute top-2 right-2 hidden group-hover:flex items-center gap-1 bg-white border border-line rounded-lg px-1 py-0.5 shadow-sm">
        <button class="text-ink-500 hover:text-primary p-1" data-ll-replace="${i}" title="Replace"><i data-lucide="repeat" class="w-3.5 h-3.5"></i></button>
        <button class="text-ink-500 hover:text-primary p-1" data-ll-download="${i}" title="Download"><i data-lucide="download" class="w-3.5 h-3.5"></i></button>
        <button class="text-ink-500 hover:text-danger p-1" data-ll-del="${i}" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
      </div>
    </div>`;
  }).join('') : `<div class="col-span-full text-[12px] text-ink-400 text-center py-6 border border-dashed border-line rounded-xl">No logos yet. Upload PNG/JPG/SVG to start.</div>`;
  grid.querySelectorAll('[data-ll-name]').forEach(inp=>inp.oninput=e=>{ editingDraft[+e.target.dataset.llName].name=e.target.value; });
  grid.querySelectorAll('[data-ll-tag]').forEach(s=>s.onchange=e=>{ llChangeTag(+e.target.dataset.llTag, e.target.value); });
  grid.querySelectorAll('[data-ll-default]').forEach(b=>b.onclick=()=>llSetDefault(+b.dataset.llDefault));
  grid.querySelectorAll('[data-ll-replace]').forEach(b=>b.onclick=()=>llTriggerFile('replace', +b.dataset.llReplace));
  grid.querySelectorAll('[data-ll-download]').forEach(b=>b.onclick=()=>llDownload(+b.dataset.llDownload));
  grid.querySelectorAll('[data-ll-del]').forEach(b=>b.onclick=()=>llDelete(+b.dataset.llDel));
  const up=document.getElementById('llUpload'); if(up) up.onclick=()=>llTriggerFile('new', null);
  const drop=document.getElementById('llDrop');
  if(drop){
    drop.ondragover=e=>{ e.preventDefault(); drop.classList.add('border-primary'); };
    drop.ondragleave=()=>drop.classList.remove('border-primary');
    drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove('border-primary'); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) llApplyUpload('new', null, f); };

  rEl.innerHTML=d.reasons.length?d.reasons.map((r,i)=>`<div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${r.enabled!==false?'bg-white':'bg-surface'}"><button class="toggle ${r.enabled!==false?'on':''}" data-gem-ren="${i}"><span class="dot"></span></button><input class="inp flex-1 text-[13px] border-0 bg-transparent p-0 ${r.enabled!==false?'':'line-through text-ink-400'}" data-gem-rlabel="${i}" value="${escapeHtml(r.label||'')}"><button class="text-ink-400 hover:text-danger" data-gem-rrm="${i}"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join(''):'<div class="text-[11px] text-ink-400 italic">No reasons.</div>';
  wrap.querySelectorAll('[data-gem-cat]').forEach(b=>b.onclick=()=>{const c=b.dataset.gemCat;w.searchMandatory[c]=!w.searchMandatory[c];renderGemWorkflowAll();});

  const sc=document.getElementById('gemScope'); if(sc) sc.onchange=e=>{w.searchScope=e.target.value;};
  const vd=document.getElementById('gemValidity'); if(vd) vd.onchange=e=>{w.validityDays=Math.max(0,parseInt(e.target.value,10)||0);};
  const vb=document.getElementById('gemVerifiedBy'); if(vb) vb.onchange=e=>{w.verifiedByRole=e.target.value;};
  rEl.querySelectorAll('[data-gem-ren]').forEach(b=>b.onclick=()=>{const r=d.reasons[+b.dataset.gemRen];r.enabled=r.enabled===false?true:false;renderGemWorkflowAll();});
  rEl.querySelectorAll('[data-gem-rlabel]').forEach(inp=>inp.oninput=e=>{d.reasons[+e.target.dataset.gemRlabel].label=e.target.value;});
  rEl.querySelectorAll('[data-gem-rrm]').forEach(b=>b.onclick=()=>{d.reasons.splice(+b.dataset.gemRrm,1);renderGemWorkflowAll();});
  const addR=document.getElementById('gemAddReason'); const newR=document.getElementById('gemNewReason');
  if(addR) addR.onclick=()=>{const v=((newR&&newR.value)||'').trim();if(!v)return;d.reasons.push({label:v,enabled:true});renderGemWorkflowAll();};

  refreshIcons();
}

function renderStdRespAll() {
  // Normalize entries (backward compatibility + defaults)
  editingDraft = (editingDraft||[]).map(r => ({
    status: r.status || 'live',
    category: r.category || 'General',
    title: r.title || '',
    body: r.body || '',
    usedTimes: r.usedTimes || 0,
    submittedBy: r.submittedBy,
    submittedAt: r.submittedAt,
  }));

  const total = editingDraft.length;
  const countEl = document.getElementById('stdRespCount');
  if (countEl) countEl.textContent = `${total} response${total!==1?'s':''}`;

  // Filter chips
  const cats = ['All', ...new Set(editingDraft.map(r => r.category))];
  const filtersEl = document.getElementById('stdRespFilters');
  if (filtersEl) {
    filtersEl.innerHTML = cats.map(cat =>
      `<button class="text-[12px] px-3 py-1 rounded-full border ${stdRespState.filter===cat?'bg-primary text-white border-primary':'border-line hover:bg-surface text-ink-700'}" data-filter="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
    ).join('');
    filtersEl.querySelectorAll('button[data-filter]').forEach(b => b.onclick = () => {
      stdRespState.filter = b.dataset.filter;
      renderStdRespAll();
    });
  }

  // Filtered list
  const filtered = editingDraft.filter(r => {
    if (stdRespState.filter !== 'All' && r.category !== stdRespState.filter) return false;
    if (stdRespState.search) {
      const q = stdRespState.search.toLowerCase();
      if (!((r.title+' '+r.body+' '+r.category).toLowerCase().includes(q))) return false;
    }
    return true;
  });

  const listEl = document.getElementById('stdRespList');
  if (!listEl) return;

  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="text-center py-12 text-ink-500">
        <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 text-ink-400"></i>
        <div class="text-[13px]">No responses match.</div>
      </div>`;
    refreshIcons();
    bindStdRespControlHandlers();
    return;
  }

  listEl.innerHTML = filtered.map((r) => {
    const idx = editingDraft.indexOf(r);
    const isPending = r.status === 'pending';
    const isEditing = stdRespState.editing === idx;

    if (isEditing) {
      return `
        <div class="bg-primary-light/40 border border-primary/30 rounded-xl p-4 space-y-3">
          <input class="inp w-full" data-edit-field="title" data-idx="${idx}" value="${escapeHtml(r.title)}" placeholder="Response title">
          <select class="inp w-full" data-edit-field="category" data-idx="${idx}">
            ${[...new Set(['Eligibility','Technical','Financial','Scope','Timeline','BOQ','General',...editingDraft.map(x=>x.category)])].map(c => `<option ${c===r.category?'selected':''}>${escapeHtml(c)}</option>`).join('')}
          </select>
          <textarea class="inp w-full" rows="5" data-edit-field="body" data-idx="${idx}">${escapeHtml(r.body)}</textarea>
          <div class="flex justify-end gap-2">
            <button class="btn" data-edit-cancel>Cancel</button>
            <button class="btn btn-primary" data-edit-done>Done</button>
          </div>
        </div>`;
    }

    return `
      <div class="bg-white border ${isPending?'border-warning/40':'border-line'} rounded-xl p-4 space-y-2">
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="chip" style="background:#EFF6FF;color:#0F5EE8;text-transform:uppercase;letter-spacing:0.04em">${escapeHtml(r.category)}</span>
            ${isPending ? `<span class="chip" style="background:#FFFBEB;color:#F59E0B">Pending review</span>` : ''}
          </div>
          <div class="text-[11px] text-ink-400 text-right shrink-0">
            ${isPending ? `Submitted by ${escapeHtml(r.submittedBy||'?')}<br>${timeAgo(r.submittedAt||Date.now())}` : `Used ${r.usedTimes||0} times`}
          </div>
        </div>
        ${r.title ? `<div class="text-[14px] font-semibold text-ink-900">${escapeHtml(r.title)}</div>` : ''}
        <div class="text-[12.5px] text-ink-700 leading-relaxed">${escapeHtml(r.body)}</div>
        <div class="flex items-center gap-2 pt-2 flex-wrap">
          ${isPending ? `
            <button class="btn btn-primary" data-approve-idx="${idx}"><i data-lucide="check" class="w-3.5 h-3.5"></i> Approve &amp; add</button>
            <button class="btn btn-danger" data-reject-idx="${idx}"><i data-lucide="x" class="w-3.5 h-3.5"></i> Reject</button>
          ` : ''}
          <button class="btn" data-edit-idx="${idx}"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit</button>
          <button class="text-ink-400 hover:text-danger ml-auto" data-delete-idx="${idx}" aria-label="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </div>`;
  }).join('');

  // Inline-edit field listeners (write through to editingDraft as user types)
  listEl.querySelectorAll('[data-edit-field]').forEach(inp => {
    inp.oninput = e => {
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.editField;
      editingDraft[idx][field] = e.target.value;
    };
  });

  // Buttons
  listEl.querySelectorAll('[data-edit-idx]').forEach(b => b.onclick = () => {
    stdRespState.editing = +b.dataset.editIdx;
    renderStdRespAll();
  });
  listEl.querySelectorAll('[data-edit-done]').forEach(b => b.onclick = () => {
    stdRespState.editing = null;
    renderStdRespAll();
  });
  listEl.querySelectorAll('[data-edit-cancel]').forEach(b => b.onclick = () => {
    stdRespState.editing = null;
    renderStdRespAll();
  });
  listEl.querySelectorAll('[data-delete-idx]').forEach(b => b.onclick = () => {
    if (!confirm('Delete this response?')) return;
    editingDraft.splice(+b.dataset.deleteIdx, 1);
    renderStdRespAll();
  });
  listEl.querySelectorAll('[data-approve-idx]').forEach(b => b.onclick = () => {
    const idx = +b.dataset.approveIdx;
    editingDraft[idx].status = 'live';
    editingDraft[idx].usedTimes = 0;
    delete editingDraft[idx].submittedBy;
    delete editingDraft[idx].submittedAt;
    toast('Approved and added to library');
    renderStdRespAll();
  });
  listEl.querySelectorAll('[data-reject-idx]').forEach(b => b.onclick = () => {
    const reason = prompt('Reason for rejection (will be logged on Save):');
    if (reason === null) return;
    editingDraft.splice(+b.dataset.rejectIdx, 1);
    toast('Rejected');
    renderStdRespAll();
  });

  refreshIcons();
  bindStdRespControlHandlers();
}

function bindStdRespControlHandlers() {
  // Search
  const search = document.getElementById('stdRespSearch');
  if (search && !search.dataset.bound) {
    search.dataset.bound = '1';
    search.value = stdRespState.search;
    search.oninput = e => {
      stdRespState.search = e.target.value;
      renderStdRespAll();
    };
  }

  // Add new toggle
  const addBtn = document.getElementById('stdRespAddBtn');
  const addForm = document.getElementById('stdRespAddForm');
  if (addBtn && !addBtn.dataset.bound) {
    addBtn.dataset.bound = '1';
    addBtn.onclick = () => {
      addForm.classList.toggle('hidden');
      if (!addForm.classList.contains('hidden')) {
        const cats = [...new Set(['Eligibility','Technical','Financial','Scope','Timeline','BOQ','General',...editingDraft.map(r => r.category)])];
        const sel = document.getElementById('stdRespNewCategory');
        sel.innerHTML = cats.map(c => `<option>${escapeHtml(c)}</option>`).join('');
      }
    };
  }

  const cancelBtn = document.getElementById('stdRespNewCancel');
  if (cancelBtn && !cancelBtn.dataset.bound) {
    cancelBtn.dataset.bound = '1';
    cancelBtn.onclick = () => {
      addForm.classList.add('hidden');
      document.getElementById('stdRespNewTitle').value = '';
      document.getElementById('stdRespNewBody').value = '';
    };
  }

  const saveNewBtn = document.getElementById('stdRespNewSave');
  if (saveNewBtn && !saveNewBtn.dataset.bound) {
    saveNewBtn.dataset.bound = '1';
    saveNewBtn.onclick = () => {
      const title = document.getElementById('stdRespNewTitle').value.trim();
      const cat = document.getElementById('stdRespNewCategory').value;
      const body = document.getElementById('stdRespNewBody').value.trim();
      if (!body) { toast('Response text is required'); return; }
      editingDraft.push({
        status: 'live',
        category: cat || 'General',
        title,
        body,
        usedTimes: 0
      });
      document.getElementById('stdRespNewTitle').value = '';
      document.getElementById('stdRespNewBody').value = '';
      addForm.classList.add('hidden');
      toast('Added to library');
      renderStdRespAll();
    };
  }
}

function renderGenericPresetsCombined() {
  // Migrate old shapes if needed
  if (Array.isArray(editingDraft)) {
    // Old shape: array of strings or array of {label, enabled} from the old prebid.generic-presets
    // Try to recover old access data from localStorage if it exists
    const store = loadStore();
    const oldAccess = store['prebid.generic-presets-access'];
    editingDraft = {
      presets: editingDraft,
      access: Array.isArray(oldAccess) ? oldAccess : [
        {label:'Super Admin', enabled:true},
        {label:'Technical Officer', enabled:false},
        {label:'Finance Officer', enabled:false},
        {label:'Deputy Commissioner', enabled:true},
        {label:'Accounts Officer', enabled:false},
      ]
    };
  }
  if (!editingDraft || typeof editingDraft !== 'object') {
    editingDraft = {presets: [], access: []};
  }
  if (!Array.isArray(editingDraft.presets)) editingDraft.presets = [];
  if (!Array.isArray(editingDraft.access)) editingDraft.access = [];
  editingDraft.presets = editingDraft.presets.map(normalizeListItem);
  editingDraft.access  = editingDraft.access.map(normalizeListItem);

  const cnt = document.getElementById('gpcPresetCount');
  if (cnt) cnt.textContent = `${editingDraft.presets.length} preset${editingDraft.presets.length!==1?'s':''}`;

  const rowHtml = (item, i, scope, allowDelete) => `
    <div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${!item.enabled ? 'bg-surface' : 'bg-white'}">
      <button class="toggle ${item.enabled ? 'on' : ''}" data-gpc-toggle="${scope}|${i}" aria-pressed="${item.enabled ? 'true' : 'false'}" aria-label="Enable or disable"><span class="dot"></span></button>
      <input type="text" class="flex-1 bg-transparent text-[13px] ${!item.enabled ? 'line-through text-ink-400' : 'text-ink-900'} focus:outline-none focus:ring-0 border-0 p-0" data-gpc-label="${scope}|${i}" value="${escapeHtml(item.label)}" />
      ${allowDelete ? `<button data-gpc-rm="${scope}|${i}" class="text-ink-400 hover:text-danger transition" aria-label="Remove"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
    </div>
  `;

  const presetsEl = document.getElementById('gpcPresets');
  const accessEl  = document.getElementById('gpcAccess');
  if (presetsEl) presetsEl.innerHTML = editingDraft.presets.map((it,i) => rowHtml(it,i,'presets',true)).join('');
  if (accessEl)  accessEl.innerHTML  = editingDraft.access.map((it,i)  => rowHtml(it,i,'access',true)).join('');

  // Toggle clicks
  document.querySelectorAll('[data-gpc-toggle]').forEach(b => b.onclick = () => {
    const [scope, iStr] = b.dataset.gpcToggle.split('|');
    const i = +iStr;
    editingDraft[scope][i].enabled = !editingDraft[scope][i].enabled;
    renderGenericPresetsCombined();
  });

  // Label edits (live)
  document.querySelectorAll('input[data-gpc-label]').forEach(inp => {
    inp.oninput = e => {
      const [scope, iStr] = e.target.dataset.gpcLabel.split('|');
      const i = +iStr;
      editingDraft[scope][i].label = e.target.value;
    };
  });

  // Remove
  document.querySelectorAll('button[data-gpc-rm]').forEach(b => b.onclick = () => {
    const [scope, iStr] = b.dataset.gpcRm.split('|');
    const i = +iStr;
    editingDraft[scope].splice(i, 1);
    renderGenericPresetsCombined();
  });

  // Add new preset
  const addBtn   = document.getElementById('gpcAddPreset');
  const newInput = document.getElementById('gpcNewPreset');
  if (addBtn && !addBtn.dataset.bound) {
    addBtn.dataset.bound = '1';
    addBtn.onclick = () => {
      const v = (newInput && newInput.value || '').trim();
      if (!v) return;
      editingDraft.presets.push({label: v, enabled: true});
      newInput.value = '';
      renderGenericPresetsCombined();
    };
  }
  if (newInput && !newInput.dataset.bound) {
    newInput.dataset.bound = '1';
    newInput.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
    };
  }

  refreshIcons();
}
