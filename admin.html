function renderPreBidDatesAll() {
  if (!editingDraft || typeof editingDraft !== 'object' || Array.isArray(editingDraft)) {
    editingDraft = JSON.parse(JSON.stringify(ITEMS.find(i => i.id === 'prebid.dates').def));
  }
  editingDraft.defaults   = editingDraft.defaults   || {};
  editingDraft.lockPolicy = editingDraft.lockPolicy || {};
  editingDraft.access     = editingDraft.access     || [];
  editingDraft.tenders    = editingDraft.tenders    || [];

  // --- Section 1: Defaults ---
  const defaultsConfig = [
    {key:'publishToPreBidDays',            label:'Tender release → Pre-bid meeting'},
    {key:'preBidToWindowCloseDays',        label:'Pre-bid meeting → Window close'},
    {key:'windowCloseToResponseDueDays',   label:'Window close → Response due'},
    {key:'notifyAdvanceDays',              label:'Notify vendors this many days before deadline'},
  ];
  document.getElementById('pbdDefaults').innerHTML = defaultsConfig.map(c => `
    <div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg bg-white">
      <div class="flex-1 text-[13px] text-ink-900">${escapeHtml(c.label)}</div>
      <input type="number" min="0" class="inp w-20 text-right" data-pbd-default="${c.key}" value="${editingDraft.defaults[c.key] || 0}">
      <span class="text-[12px] text-ink-500 w-12">days</span>
    </div>
  `).join('');
  document.querySelectorAll('[data-pbd-default]').forEach(inp => {
    inp.onchange = e => { editingDraft.defaults[e.target.dataset.pbdDefault] = +e.target.value; };
  });

  // --- Section 2: Lock policy ---
  const lockConfig = [
    {key:'lockAfterPublish',             label:'Lock dates after publish (edits require corrigendum)'},
    {key:'autoCorrigendumOnDateChange',  label:'Auto-generate a corrigendum on any date change post-publish'},
    {key:'notifyVendorsOnChange',        label:'Notify all bidding vendors when dates change'},
    {key:'requireReasonForChange',       label:'Require a written reason for every date change'},
  ];
  document.getElementById('pbdLockPolicy').innerHTML = lockConfig.map(c => {
    const on = !!editingDraft.lockPolicy[c.key];
    return `
      <div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${on ? 'bg-white' : 'bg-surface'}">
        <button class="toggle ${on ? 'on' : ''}" data-pbd-lock="${c.key}" aria-pressed="${on}"><span class="dot"></span></button>
        <div class="flex-1 text-[13px] ${on ? 'text-ink-900' : 'text-ink-500'}">${escapeHtml(c.label)}</div>
      </div>
    `;
  }).join('');
  document.querySelectorAll('[data-pbd-lock]').forEach(b => b.onclick = () => {
    editingDraft.lockPolicy[b.dataset.pbdLock] = !editingDraft.lockPolicy[b.dataset.pbdLock];
    renderPreBidDatesAll();
  });

  // --- Section 3: Access ---
  editingDraft.access = editingDraft.access.map(normalizeListItem);
  document.getElementById('pbdAccess').innerHTML = editingDraft.access.map((it, i) => `
    <div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${!it.enabled ? 'bg-surface' : 'bg-white'}">
      <button class="toggle ${it.enabled ? 'on' : ''}" data-pbd-acc="${i}" aria-pressed="${!!it.enabled}"><span class="dot"></span></button>
      <input type="text" class="flex-1 bg-transparent text-[13px] ${!it.enabled ? 'line-through text-ink-400' : 'text-ink-900'} focus:outline-none border-0 p-0" data-pbd-acc-label="${i}" value="${escapeHtml(it.label)}" />
      <button data-pbd-acc-rm="${i}" class="text-ink-400 hover:text-danger transition" aria-label="Remove role"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
  `).join('');
  document.querySelectorAll('[data-pbd-acc]').forEach(b => b.onclick = () => {
    const i = +b.dataset.pbdAcc;
    editingDraft.access[i].enabled = !editingDraft.access[i].enabled;
    renderPreBidDatesAll();
  });
  document.querySelectorAll('[data-pbd-acc-label]').forEach(inp => {
    inp.oninput = e => { editingDraft.access[+e.target.dataset.pbdAccLabel].label = e.target.value; };
  });
  document.querySelectorAll('[data-pbd-acc-rm]').forEach(b => b.onclick = () => {
    editingDraft.access.splice(+b.dataset.pbdAccRm, 1);
    renderPreBidDatesAll();
  });

  // Bind "Add new role" controls (bind-once pattern)
  const newAccessBtn = document.getElementById('pbdAddAccess');
  const newAccessInp = document.getElementById('pbdNewAccess');
  if (newAccessBtn && !newAccessBtn.dataset.bound) {
    newAccessBtn.dataset.bound = '1';
    newAccessBtn.onclick = () => {
      const v = (newAccessInp.value || '').trim();
      if (!v) return;
      editingDraft.access.push({label: v, enabled: true});
      newAccessInp.value = '';
      renderPreBidDatesAll();
    };
  }
  if (newAccessInp && !newAccessInp.dataset.bound) {
    newAccessInp.dataset.bound = '1';
    newAccessInp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); newAccessBtn.click(); } };
  }

  // --- Section 4: Tender list ---
  const allStatuses = ['All','Draft','Active','Published','Closed'];
  document.getElementById('pbdStatusFilters').innerHTML = allStatuses.map(s => `
    <button class="text-[12px] px-3 py-1 rounded-full border ${pbdState.statusFilter===s?'bg-primary text-white border-primary':'border-line hover:bg-surface text-ink-700'}" data-pbd-status="${s}">${escapeHtml(s)}</button>
  `).join('');
  document.querySelectorAll('[data-pbd-status]').forEach(b => b.onclick = () => {
    pbdState.statusFilter = b.dataset.pbdStatus;
    renderPreBidDatesAll();
  });

  const filtered = editingDraft.tenders.filter(t => {
    if (pbdState.statusFilter !== 'All' && t.status !== pbdState.statusFilter) return false;
    if (pbdState.search) {
      const q = pbdState.search.toLowerCase();
      if (!((t.id+' '+t.title).toLowerCase().includes(q))) return false;
    }
    return true;
  });
  document.getElementById('pbdTenderCount').textContent = `${filtered.length} of ${editingDraft.tenders.length} tenders`;

  const statusColor = { Draft:'#6B7280', Active:'#10B981', Published:'#0F5EE8', Closed:'#9CA3AF' };
  const labelFor    = { publish:'Tender release', preBidMeeting:'Pre-bid meeting', windowClose:'Window close', responseDue:'Response due' };

  document.getElementById('pbdTenderList').innerHTML = filtered.length === 0
    ? `<div class="text-center py-8 text-ink-500 text-[13px]">No tenders match.</div>`
    : filtered.map(t => {
        const tIdx     = editingDraft.tenders.indexOf(t);
        const expanded = pbdState.expandedTender === tIdx;
        const locked   = (t.status === 'Published' || t.status === 'Closed') && editingDraft.lockPolicy.lockAfterPublish;
        const c        = statusColor[t.status] || '#6B7280';
        const dates    = t.dates || {};

        const summaryGrid = `
          <div class="grid grid-cols-4 gap-2 mt-2 text-[11.5px]">
            ${['publish','preBidMeeting','windowClose','responseDue'].map(f => `
              <div><span class="text-ink-500 block">${escapeHtml(labelFor[f])}</span><span class="text-ink-900">${escapeHtml(dates[f]||'—')}</span></div>
            `).join('')}
          </div>`;

        const editGrid = `
          <div class="mt-3 pt-3 border-t border-line space-y-2">
            ${['publish','preBidMeeting','windowClose','responseDue'].map(f => `
              <div class="flex items-center gap-3">
                <div class="text-[12.5px] text-ink-500 w-36">${escapeHtml(labelFor[f])}</div>
                <input type="date" class="inp flex-1" data-pbd-date="${tIdx}|${f}" value="${escapeHtml(dates[f]||'')}" ${locked ? 'disabled' : ''}>
              </div>
            `).join('')}
            ${locked ? `<div class="text-[11.5px] text-warning bg-warning-light border border-warning/20 rounded-lg p-2.5 mt-2 flex items-start gap-2"><i data-lucide="lock" class="w-3.5 h-3.5 shrink-0 mt-0.5"></i><span>This tender is locked. Changing dates requires a corrigendum (per your lock policy above).</span></div>` : ''}
          </div>`;

        return `
          <div class="bg-white border border-line rounded-xl p-4">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="font-mono text-[12px] text-ink-500">${escapeHtml(t.id)}</span>
                  <span class="chip" style="background:${c}1a;color:${c}">${escapeHtml(t.status)}</span>
                  ${locked ? `<span class="chip" style="background:#FEF3C7;color:#92400E"><i data-lucide="lock" class="w-3 h-3 inline -mt-0.5"></i> Locked</span>` : ''}
                </div>
                <div class="text-[14px] font-semibold text-ink-900">${escapeHtml(t.title)}</div>
              </div>
              <button class="btn" data-pbd-toggle-tender="${tIdx}">${expanded ? 'Collapse' : (locked ? 'View' : 'Edit dates')}</button>
            </div>
            ${expanded ? editGrid : summaryGrid}
          </div>`;
      }).join('');

  document.querySelectorAll('[data-pbd-toggle-tender]').forEach(b => b.onclick = () => {
    const i = +b.dataset.pbdToggleTender;
    pbdState.expandedTender = pbdState.expandedTender === i ? null : i;
    renderPreBidDatesAll();
  });
  document.querySelectorAll('[data-pbd-date]').forEach(inp => {
    inp.onchange = e => {
      const [iStr, field] = e.target.dataset.pbdDate.split('|');
      const i = +iStr;
      editingDraft.tenders[i].dates = editingDraft.tenders[i].dates || {};
      editingDraft.tenders[i].dates[field] = e.target.value;
    };
  });

  // Search binding (bind once)
  const searchEl = document.getElementById('pbdSearch');
  if (searchEl && !searchEl.dataset.bound) {
    searchEl.dataset.bound = '1';
    searchEl.value = pbdState.search;
    searchEl.oninput = e => { pbdState.search = e.target.value; renderPreBidDatesAll(); };
  }

  refreshIcons();
}

    : `<div class="text-[12px] text-ink-400 italic">All available actions are added.</div>`;
  const addActionBtn = document.getElementById('pbcAddActionBtn');
  if (addActionBtn) {
    addActionBtn.onclick = () => {
      const sel = document.getElementById('pbcAddActionSelect');
      const v = sel && sel.value;
      if (!v) return;
      editingDraft.actions.push({label: v, enabled: true});
      renderPreBidCommitteeAll();
    };
  }

  // --- Section 3: Members matrix ---
  const enabledActions = editingDraft.actions.filter(a => a.enabled);
  const enabledDesigs  = editingDraft.designations.filter(d => d.enabled);
  const store = loadStore();
  const officerDir = store['officers.directory'] || (ITEMS.find(i => i.id === 'officers.directory') || {def:[]}).def || [];
  const dirMap = {};
  officerDir.forEach(o => { const nm = o.name || o.label || ''; if (nm) dirMap[nm] = {email: o.email || '', role: o.role || ''}; });

  document.getElementById('pbcMemberCount').textContent = `${editingDraft.members.length} member${editingDraft.members.length!==1?'s':''}`;

  const OFFW = 240, DESW = 190;
  const stickyOff = `position:sticky;left:0;background:#fff;border-bottom:1px solid #E5E7EB;min-width:${OFFW}px`;
  const stickyDes = `position:sticky;left:${OFFW}px;background:#fff;border-bottom:1px solid #E5E7EB;border-right:1px solid #E5E7EB;min-width:${DESW}px`;

  const memWrap = document.getElementById('pbcMembersWrap');
  if (editingDraft.members.length === 0) {
    memWrap.innerHTML = `<div class="text-center py-8 text-ink-500 text-[13px] border border-dashed border-line rounded-xl">No members yet. Click "Invite member" below to add officers to the committee.</div>`;
  } else {
    memWrap.innerHTML = `<table class="text-[12.5px]" style="border-collapse:separate;border-spacing:0;min-width:100%">
        <thead>
          <tr>
            <th class="text-left font-semibold text-ink-500" style="${stickyOff};z-index:2;padding:8px;vertical-align:bottom">Officer</th>
            <th class="text-left font-semibold text-ink-500" style="${stickyDes};z-index:2;padding:8px;vertical-align:bottom">Designation</th>
            ${enabledActions.map(a => `<th style="min-width:104px;padding:8px;vertical-align:bottom;border-bottom:1px solid #E5E7EB"><div class="text-[11px] font-semibold text-ink-500 leading-tight" style="white-space:normal">${escapeHtml(a.label)}</div></th>`).join('')}
            <th style="border-bottom:1px solid #E5E7EB;padding:8px"></th>
          </tr>
        </thead>
        <tbody>
          ${editingDraft.members.map((m, i) => {
            const info = dirMap[m.officer] || {email:'', role:''};
            const av = `<div class="rounded-full flex items-center justify-center text-white font-semibold shrink-0" style="width:30px;height:30px;font-size:11px;background:${pbcAvatarColor(m.officer)}">${escapeHtml(pbcInitials(m.officer))}</div>`;
            return `<tr>
              <td style="${stickyOff};z-index:1;padding:8px">
                <div class="flex items-center gap-2.5">
                  ${av}
                  <div class="min-w-0">
                    <div class="text-[13px] font-medium text-ink-900 truncate">${escapeHtml(m.officer || '—')}</div>
                    ${info.email ? `<div class="text-[11px] text-ink-500 truncate">${escapeHtml(info.email)}</div>` : ''}
                  </div>
                </div>
              </td>
              <td style="${stickyDes};z-index:1;padding:8px">
                <select class="inp w-full" data-pbc-mem-desig="${i}">
                  ${enabledDesigs.map(d => `<option ${d.label === m.designation ? 'selected' : ''}>${escapeHtml(d.label)}</option>`).join('')}
                  ${(m.designation && !enabledDesigs.find(d => d.label === m.designation)) ? `<option selected>${escapeHtml(m.designation)}</option>` : ''}
                </select>
              </td>
              ${enabledActions.map(a => {
                const granted = !!(m.permissions && m.permissions[a.label]);
                return `<td style="text-align:center;padding:8px;border-bottom:1px solid #E5E7EB"><button class="toggle ${granted ? 'on' : ''}" data-pbc-perm="${i}|${escapeHtml(a.label)}" aria-pressed="${granted}" title="${escapeHtml(a.label)}" style="margin:0 auto"><span class="dot"></span></button></td>`;
              }).join('')}
              <td style="text-align:center;padding:8px;border-bottom:1px solid #E5E7EB"><button data-pbc-mem-rm="${i}" class="text-ink-400 hover:text-danger" aria-label="Remove"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  memWrap.querySelectorAll('[data-pbc-mem-desig]').forEach(sel => {
    sel.onchange = e => { editingDraft.members[+e.target.dataset.pbcMemDesig].designation = e.target.value; };
  });
  memWrap.querySelectorAll('[data-pbc-perm]').forEach(b => b.onclick = () => {
    const raw = b.dataset.pbcPerm; const sep = raw.indexOf('|');
    const i = +raw.slice(0, sep); const actionLabel = raw.slice(sep + 1);
    if (!editingDraft.members[i].permissions) editingDraft.members[i].permissions = {};
    editingDraft.members[i].permissions[actionLabel] = !editingDraft.members[i].permissions[actionLabel];
    renderPreBidCommitteeAll();
  });
  memWrap.querySelectorAll('[data-pbc-mem-rm]').forEach(b => b.onclick = () => {
    editingDraft.members.splice(+b.dataset.pbcMemRm, 1);
    renderPreBidCommitteeAll();
  });

  // Invite-member button + modal controls (bind-once)
  const inviteBtn = document.getElementById('pbcInviteBtn');
  if (inviteBtn && !inviteBtn.dataset.bound) { inviteBtn.dataset.bound = '1'; inviteBtn.onclick = () => pbcOpenInvite(); }
  const invClose = document.getElementById('pbcInviteClose');
  if (invClose && !invClose.dataset.bound) { invClose.dataset.bound = '1'; invClose.onclick = () => pbcCloseInvite(); }
  const invBackdrop = document.getElementById('pbcInviteBackdrop');
  if (invBackdrop && !invBackdrop.dataset.bound) { invBackdrop.dataset.bound = '1'; invBackdrop.onclick = () => pbcCloseInvite(); }
  const invSearch = document.getElementById('pbcInviteSearch');
  if (invSearch && !invSearch.dataset.bound) { invSearch.dataset.bound = '1'; invSearch.oninput = () => renderPbcInviteList(); }

  refreshIcons();
}

/* invite-member modal (searchable officer picker for the committee) */
function pbcOpenInvite() {
  const modal = document.getElementById('pbcInviteModal');
  if (!modal) return;
  modal.classList.remove('hidden');
  const s = document.getElementById('pbcInviteSearch');
  if (s) s.value = '';
  renderPbcInviteList();
  if (s && s.focus) s.focus();
}
function pbcCloseInvite() {
  const modal = document.getElementById('pbcInviteModal');
  if (modal) modal.classList.add('hidden');
}
function renderPbcInviteList() {
  const listEl = document.getElementById('pbcInviteList');
  if (!listEl) return;
  const store = loadStore();
  const officerDir = store['officers.directory'] || (ITEMS.find(i => i.id === 'officers.directory') || {def:[]}).def || [];
  const q = ((document.getElementById('pbcInviteSearch') || {}).value || '').toLowerCase();
  const added = new Set((editingDraft.members || []).map(m => m.officer));
  const rows = officerDir
    .map(o => ({ name: o.name || o.label || '', email: o.email || '', role: o.role || '' }))
    .filter(o => o.name)
    .filter(o => !q || (o.name + ' ' + o.email).toLowerCase().includes(q));
  if (!rows.length) { listEl.innerHTML = `<div class="text-center py-8 text-ink-500 text-[13px]">No officers match.</div>`; refreshIcons(); return; }
  listEl.innerHTML = rows.map(o => {
    const isAdded = added.has(o.name);
    const av = `<div class="rounded-full flex items-center justify-center text-white font-semibold shrink-0" style="width:34px;height:34px;font-size:12px;background:${pbcAvatarColor(o.name)}">${escapeHtml(pbcInitials(o.name))}</div>`;
    return `<button class="w-full flex items-center gap-3 px-2.5 py-2 rounded-lg text-left ${isAdded ? 'opacity-50 cursor-not-allowed' : 'hover:bg-surface'}" ${isAdded ? 'disabled' : `data-pbc-invite="${escapeHtml(o.name)}"`}>
      ${av}
      <div class="min-w-0 flex-1">
        <div class="text-[13px] font-medium text-ink-900 truncate">${escapeHtml(o.name)}${isAdded ? ' <span class="text-[11px] font-normal text-ink-400">· Already added</span>' : ''}</div>
        <div class="text-[11.5px] text-ink-500 truncate">${escapeHtml(o.email)}${o.role ? ' · ' + escapeHtml(o.role) : ''}</div>
      </div>
    </button>`;
  }).join('');
  listEl.querySelectorAll('[data-pbc-invite]').forEach(b => b.onclick = () => {
    const name = b.dataset.pbcInvite;
    const enabledDesigs = editingDraft.designations.filter(d => d.enabled);
    const enabledActions = editingDraft.actions.filter(a => a.enabled);
    const permissions = {};
    enabledActions.forEach(a => permissions[a.label] = false);
    editingDraft.members.push({ officer: name, designation: enabledDesigs[0] ? enabledDesigs[0].label : '', permissions });
    pbcCloseInvite();
    renderPreBidCommitteeAll();
  });
  refreshIcons();
}

/* ---- tender ID numbering (format + live preview + sequence + FY reset) ---- */
function tnumPreview(d){
  d = d || {};
  const seq = String(d.sequence==null?1:d.sequence);
  let s = String(d.format||'');
  s = s.replace(/\{dept\}/g,'PROC').replace(/\{fy\}/g,'2026-27').replace(/\{type\}/g,'GOODS')
       .replace(/\{seq:0(\d+)\}/g,(_,n)=>seq.padStart(+n,'0')).replace(/\{seq\}/g,seq);
  return s;
}
function editorTenderNumbering(){
  return `
    <div class="space-y-4" id="tnumWrap">
      <div>
        <label class="text-[12px] text-ink-500 mb-1 block font-medium">Tender ID format</label>
        <input id="tnumFormat" class="inp w-full font-mono">
        <div class="text-[12.5px] text-ink-500 mt-2">Preview: <span id="tnumPreview" class="font-mono text-ink-900"></span></div>
        <div class="text-[11px] text-ink-400 mt-1">Placeholders: <span class="font-mono">{dept}</span> · <span class="font-mono">{fy}</span> · <span class="font-mono">{type}</span> · <span class="font-mono">{seq:0N}</span> (zero-padded to N digits)</div>
      </div>
      <div class="flex items-end gap-5 flex-wrap pt-3 border-t border-line">
        <label class="block"><span class="text-[12px] text-ink-500">Current sequence</span><input id="tnumSeq" type="number" min="0" class="inp w-28 mt-1"></label>
        <label class="block"><span class="text-[12px] text-ink-500">Financial-year start month</span>
          <select id="tnumMonth" class="inp mt-1">${['January','February','March','April','May','June','July','August','September','October','November','December'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></label>
        <div class="flex items-center gap-2 pb-1.5"><button class="toggle" id="tnumReset"><span class="dot"></span></button><span class="text-[13px] text-ink-900">Reset sequence each financial year</span></div>
      </div>
    </div>`;
}
function renderTenderNumberingAll(){
  if (!editingDraft || typeof editingDraft !== 'object' || Array.isArray(editingDraft)) editingDraft = {};
  if (editingDraft.format == null) editingDraft.format = 'AMC/{dept}/{fy}/{seq:04}';
  if (editingDraft.sequence == null) editingDraft.sequence = 1;
  if (editingDraft.resetFY == null) editingDraft.resetFY = true;
  if (editingDraft.fyStartMonth == null) editingDraft.fyStartMonth = 4;
  const fmt = document.getElementById('tnumFormat'); if (fmt) fmt.value = editingDraft.format;
  const seq = document.getElementById('tnumSeq'); if (seq) seq.value = editingDraft.sequence;
  const mon = document.getElementById('tnumMonth'); if (mon) mon.value = String(editingDraft.fyStartMonth);
  const prev = document.getElementById('tnumPreview'); if (prev) prev.textContent = tnumPreview(editingDraft);
  const reset = document.getElementById('tnumReset'); if (reset) reset.classList.toggle('on', !!editingDraft.resetFY);
  if (fmt) fmt.oninput = e => { editingDraft.format = e.target.value; if (prev) prev.textContent = tnumPreview(editingDraft); };
  if (seq) seq.onchange = e => { editingDraft.sequence = parseInt(e.target.value,10)||0; if (prev) prev.textContent = tnumPreview(editingDraft); };
  if (mon) mon.onchange = e => { editingDraft.fyStartMonth = parseInt(e.target.value,10)||1; };
  if (reset) reset.onclick = () => { editingDraft.resetFY = !editingDraft.resetFY; renderTenderNumberingAll(); };
  refreshIcons();
}

/* ---- tender catalog tree — Miller-column (3-pane) browser ---- */
/* Data shape unchanged: array of {id,name,enabled,children?} nested 3 deep. */
let ttSel = {t:null, s:null, sec:null};   // selected indices per column
let ttSearch = '';
let ttRename = null;                        // "level|idx" of node being renamed
let ttRenameOrig = '';
let ttAdd = null;                           // 'type' | 'sub' | 'sec'
let ttResizeBound = false;
function ttUid(){ return 'n_' + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36); }
function ttKids(n){ return (n && Array.isArray(n.children)) ? n.children : []; }
function ttTypes(){ return Array.isArray(editingDraft) ? editingDraft : (editingDraft=[]); }
function ttSubs(t){ return (t!=null && ttTypes()[t]) ? ttKids(ttTypes()[t]) : []; }
function ttSecs(t,s){ const sub = (t!=null && s!=null) ? ttSubs(t)[s] : null; return sub ? ttKids(sub) : []; }
function ttSubtreeHasMatch(n,q){ if((n.name||'').toLowerCase().includes(q)) return true; return ttKids(n).some(c=>ttSubtreeHasMatch(c,q)); }

function editorTenderTree(){ ttSel={t:null,s:null,sec:null}; ttSearch=''; ttRename=null; ttAdd=null; return `<div id="ttRoot"></div>`; }

function renderTenderTreeAll(){
  if (!Array.isArray(editingDraft)) editingDraft = [];
  const root = document.getElementById('ttRoot');
  if (!ttResizeBound){ ttResizeBound = true; window.addEventListener('resize', ()=>{ if (editingId && (ITEMS.find(i=>i.id===editingId)||{}).t==='tender-tree' && document.getElementById('ttRoot')) renderTenderTreeAll(); }); }
  const narrow = (typeof window!=='undefined' && window.innerWidth && window.innerWidth < 900);
  const q = ttSearch.trim().toLowerCase();

  // effective selection (search auto-selects ancestors of the first match without mutating ttSel)
  let effT = ttSel.t, effS = ttSel.s, effSec = ttSel.sec;
  if (q){
    effT = ttTypes().findIndex(t=>ttSubtreeHasMatch(t,q)); if (effT<0) effT=null;
    effS = (effT!=null) ? ttSubs(effT).findIndex(s=>ttSubtreeHasMatch(s,q)) : -1; if (effS<0) effS=null;
    effSec = (effS!=null) ? ttSecs(effT,effS).findIndex(se=>(se.name||'').toLowerCase().includes(q)) : -1; if (effSec<0) effSec=null;
  }
  const vis = (n)=> !q || ttSubtreeHasMatch(n,q);

  // global counts
  let nT=0,nS=0,nSec=0,nDis=0;
  ttTypes().forEach(t=>{ nT++; if(t.enabled===false)nDis++; ttKids(t).forEach(s=>{ nS++; if(s.enabled===false)nDis++; ttKids(s).forEach(se=>{ nSec++; if(se.enabled===false)nDis++; }); }); });

  // breadcrumb
  const crumb=[];
  if(effT!=null && ttTypes()[effT]) crumb.push(ttTypes()[effT].name);
  if(effS!=null && ttSubs(effT)[effS]) crumb.push(ttSubs(effT)[effS].name);
  if(effSec!=null && ttSecs(effT,effS)[effSec]) crumb.push(ttSecs(effT,effS)[effSec].name);
  const crumbHtml = crumb.length ? crumb.map((c,i)=>`<span class="${i===crumb.length-1?'text-ink-900 font-medium':'text-ink-500'}">${escapeHtml(c||'(unnamed)')}</span>`).join('<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-ink-300 inline align-middle mx-0.5"></i>') : '<span class="text-ink-400">No selection</span>';

  // ---- one row ----
  // level: 0 type, 1 subtype, 2 sector. inheritDisabled => show "hidden via X" instead of toggle.
  function row(n, level, idx, selected, inheritDisabled, inheritName){
    const renameKey = level+'|'+idx;
    const renaming = ttRename===renameKey;
    const count = level<2 ? ttKids(n).length : null;
    const indivOff = n.enabled===false;
    const dim = inheritDisabled || indivOff;
    const nameCls = dim ? 'text-ink-400'+(indivOff&&!inheritDisabled?' line-through':'') : 'text-ink-900';
    const left = selected ? '<span class="absolute left-0 top-0 bottom-0 w-[3px] bg-primary"></span>' : '';
    const ctrl = inheritDisabled
      ? `<span class="text-[10px] text-ink-400 italic shrink-0" title="Disabled because ${escapeHtml(inheritName||'a parent')} is off">hidden via ${escapeHtml(inheritName||'parent')}</span>`
      : `<button class="toggle ${n.enabled?'on':''}" data-tt-tog="${level}|${idx}" aria-pressed="${!!n.enabled}"><span class="dot"></span></button>`;
    const nameEl = renaming
      ? `<input data-tt-rinput="${level}|${idx}" class="flex-1 min-w-0 inp" style="padding:2px 6px;font-size:12.5px" value="${escapeHtml(n.name||'')}">`
      : `<span class="flex-1 min-w-0 truncate text-[13px] ${nameCls}">${escapeHtml(n.name||'(unnamed)')}</span>`;
    const badge = count!=null ? `<span class="shrink-0 text-[10.5px] font-semibold px-1.5 py-0.5 rounded-full bg-surface text-ink-500 border border-line">${count}</span>` : '';
    const chevron = level<2 ? `<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-ink-400 shrink-0"></i>` : '';
    const actions = renaming ? '' : `<span class="opacity-0 group-hover:opacity-100 flex items-center gap-1 shrink-0 transition-opacity">
        <button data-tt-ren="${level}|${idx}" class="text-ink-400 hover:text-primary" title="Rename"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
        <button data-tt-del="${level}|${idx}" class="text-ink-400 hover:text-danger" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
      </span>`;
    return `<div data-tt-sel="${level}|${idx}" class="group relative flex items-center gap-2 px-3 py-2 cursor-pointer border-b border-line ${selected?'bg-primary-light':'hover:bg-surface'}">
        ${left}${ctrl}${nameEl}${actions}${badge}${chevron}
      </div>`;
  }

  function emptyHint(txt){ return `<div class="px-3 py-5 text-[12px] text-ink-400 text-center">${txt}</div>`; }

  function addFooter(level, label, disabled, hint){
    const key = level===0?'type':level===1?'sub':'sec';
    if (ttAdd===key){
      return `<div class="flex items-center gap-1 px-2 py-2 border-t border-line bg-surface">
        <input data-tt-ainput="${key}" class="inp flex-1" style="padding:3px 8px;font-size:12.5px" placeholder="Name…">
        <button data-tt-acommit="${key}" class="btn btn-primary" style="padding:3px 8px"><i data-lucide="check" class="w-3.5 h-3.5"></i></button>
        <button data-tt-acancel class="btn" style="padding:3px 8px"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
      </div>`;
    }
    return `<button data-tt-add="${key}" ${disabled?'disabled':''} title="${disabled?escapeHtml(hint):''}" class="w-full flex items-center gap-1.5 px-3 py-2 border-t border-line text-[12px] text-left ${disabled?'text-ink-300 cursor-not-allowed':'text-primary hover:bg-primary-light'}">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i> ${escapeHtml(label)}</button>`;
  }

  function column(headerTitle, headerSub, bodyHtml, footerHtml, dimmed){
    return `<div class="flex-1 min-w-0 border border-line rounded-xl overflow-hidden flex flex-col ${dimmed?'opacity-60':''}" style="height:520px">
      <div class="px-3 py-2 border-b border-line bg-white shrink-0">
        <div class="text-[12.5px] font-semibold text-ink-900">${escapeHtml(headerTitle)}</div>
        ${headerSub?`<div class="text-[11px] text-ink-500 truncate">${escapeHtml(headerSub)}</div>`:''}
      </div>
      <div class="flex-1 overflow-y-auto">${bodyHtml}</div>
      ${footerHtml||''}
    </div>`;
  }

  // ---- column bodies ----
  const typeRows = ttTypes().map((t,i)=>vis(t)?row(t,0,i,effT===i,false,''):'').join('') || emptyHint('No tender types yet.');

  let subBody, subDim=false, subHeaderSub='';
  if (effT==null){ subBody = emptyHint('Select a type to see its subtypes.'); }
  else {
    const tNode = ttTypes()[effT]; subHeaderSub = 'Subtypes of '+(tNode.name||'');
    subDim = tNode.enabled===false;
    const rows = ttSubs(effT).map((s,i)=>vis(s)?row(s,1,i,effS===i,subDim,tNode.name):'').join('');
    subBody = rows || emptyHint('No subtypes. Add one below.');
  }

  let secBody, secDim=false, secHeaderSub='';
  if (effT==null || effS==null){ secBody = emptyHint('Select a subtype to see its sectors.'); }
  else {
    const sNode = ttSubs(effT)[effS]; secHeaderSub = 'Sectors of '+((sNode&&sNode.name)||'');
    const typeOff = ttTypes()[effT].enabled===false;
    secDim = typeOff || (sNode && sNode.enabled===false);
    const inheritName = (sNode && sNode.enabled===false) ? sNode.name : ttTypes()[effT].name;
    const rows = ttSecs(effT,effS).map((se,i)=>vis(se)?row(se,2,i,effSec===i,secDim,inheritName):'').join('');
    secBody = rows || emptyHint('No sectors. Add one below.');
  }

  const col1 = column('Tender Type','', typeRows, addFooter(0,'Add tender type',false,''), false);
  const col2 = column('Subtype', subHeaderSub, subBody,
    addFooter(1, effT!=null?('Add subtype to '+(ttTypes()[effT].name||'')):'Add subtype', effT==null, 'Select a type first'), subDim);
  const col3 = column('Sector', secHeaderSub, secBody,
    addFooter(2, effS!=null?('Add sector to '+((ttSubs(effT)[effS]||{}).name||'')):'Add sector', effS==null, 'Select a subtype first'), secDim);

  // ---- narrow (drill-in) vs wide (3 columns) ----
  let columnsHtml;
  if (narrow){
    let one;
    if (effT==null) one = col1;
    else if (effS==null) one = col2;
    else one = col3;
    const canBack = effT!=null;
    columnsHtml = `<div class="space-y-2">
      ${canBack?`<button id="ttBack" class="btn"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back</button>`:''}
      ${one}
    </div>`;
  } else {
    columnsHtml = `<div class="flex gap-3 items-start">${col1}${col2}${col3}</div>`;
  }

  root.innerHTML = `
    <div class="space-y-3">
      <p class="text-[11.5px] text-ink-500">Click a type to see its subtypes, a subtype to see its sectors. Disabled nodes are hidden from officer pickers.</p>
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="text-[12px] text-ink-500"><strong class="text-ink-900">${nT}</strong> types · <strong class="text-ink-900">${nS}</strong> subtypes · <strong class="text-ink-900">${nSec}</strong> sectors · ${nDis} disabled</div>
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 text-ink-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
          <input id="ttSearchInp" class="inp pl-8" style="width:230px" placeholder="Search all levels…" value="${escapeHtml(ttSearch)}">
        </div>
      </div>
      <div class="flex items-center gap-1 text-[12.5px] bg-surface border border-line rounded-lg px-3 py-1.5">${crumbHtml}</div>
      ${columnsHtml}
    </div>`;

  // ---- bindings ----
  const resolvePath = (level, idx)=> level===0 ? [idx] : level===1 ? [effT, idx] : [effT, effS, idx];
  const nodeAt = (path)=>{ let n=ttTypes()[path[0]]; if(path.length>1) n=ttKids(n)[path[1]]; if(path.length>2) n=ttKids(n)[path[2]]; return n; };
  const arrAt = (level)=> level===0 ? ttTypes() : level===1 ? ttSubs(effT) : ttSecs(effT,effS);

  root.querySelectorAll('[data-tt-sel]').forEach(el=>{ el.onclick=()=>{
    const [lv,ix]=el.dataset.ttSel.split('|').map(Number);
    if (lv===0){ ttSel={t:ix,s:null,sec:null}; }
    else if (lv===1){ ttSel={t:effT,s:ix,sec:null}; }
    else { ttSel={t:effT,s:effS,sec:ix}; }
    ttSearch=''; ttRename=null; ttAdd=null; renderTenderTreeAll();
  };});
  root.querySelectorAll('[data-tt-tog]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); const [lv,ix]=b.dataset.ttTog.split('|').map(Number); const n=nodeAt(resolvePath(lv,ix)); if(n) n.enabled=!n.enabled; renderTenderTreeAll(); };});
  root.querySelectorAll('[data-tt-ren]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); const key=b.dataset.ttRen; const [lv,ix]=key.split('|').map(Number); ttRename=key; ttRenameOrig=(nodeAt(resolvePath(lv,ix))||{}).name||''; renderTenderTreeAll(); };});
  root.querySelectorAll('[data-tt-rinput]').forEach(inp=>{
    inp.onclick=(e)=>e.stopPropagation();
    inp.oninput=(e)=>{ const [lv,ix]=inp.dataset.ttRinput.split('|').map(Number); const n=nodeAt(resolvePath(lv,ix)); if(n) n.name=e.target.value; };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ ttRename=null; renderTenderTreeAll(); } else if(e.key==='Escape'){ const [lv,ix]=inp.dataset.ttRinput.split('|').map(Number); const n=nodeAt(resolvePath(lv,ix)); if(n) n.name=ttRenameOrig; ttRename=null; renderTenderTreeAll(); } };
    inp.onblur=()=>{ if(ttRename){ ttRename=null; renderTenderTreeAll(); } };
    setTimeout(()=>{ try{ inp.focus(); }catch(_){} },0);
  });
  root.querySelectorAll('[data-tt-del]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); const [lv,ix]=b.dataset.ttDel.split('|').map(Number); const path=resolvePath(lv,ix); const n=nodeAt(path); if(!n) return;
    const kc=ttKids(n).length; const childWord = lv===0?'subtype':'sector';
    const msg = kc>0 ? `Delete ${n.name||'this node'} and its ${kc} ${childWord}${kc===1?'':'s'}?` : `Delete ${n.name||'this node'}?`;
    if(!confirm(msg)) return;
    arrAt(lv).splice(ix,1);
    if(lv===0){ if(ttSel.t===ix) ttSel={t:null,s:null,sec:null}; else if(ttSel.t!=null&&ttSel.t>ix) ttSel.t--; }
    else if(lv===1){ if(ttSel.s===ix){ttSel.s=null;ttSel.sec=null;} else if(ttSel.s!=null&&ttSel.s>ix) ttSel.s--; }
    else { if(ttSel.sec===ix) ttSel.sec=null; else if(ttSel.sec!=null&&ttSel.sec>ix) ttSel.sec--; }
    renderTenderTreeAll();
  };});

  // add controls
  root.querySelectorAll('[data-tt-add]').forEach(b=>{ b.onclick=()=>{ if(b.disabled) return; ttAdd=b.dataset.ttAdd; renderTenderTreeAll(); };});
  const acancel=root.querySelector('[data-tt-acancel]'); if(acancel) acancel.onclick=()=>{ ttAdd=null; renderTenderTreeAll(); };
  const acommit=root.querySelector('[data-tt-acommit]'); const ainput=root.querySelector('[data-tt-ainput]');
  const doAdd=()=>{ const v=((ainput&&ainput.value)||'').trim(); if(!v){ ttAdd=null; return renderTenderTreeAll(); }
    if(ttAdd==='type'){ ttTypes().push({id:ttUid(),name:v,enabled:true,children:[]}); ttSel={t:ttTypes().length-1,s:null,sec:null}; }
    else if(ttAdd==='sub'){ ttSubs(effT).push({id:ttUid(),name:v,enabled:true,children:[]}); ttSel={t:effT,s:ttSubs(effT).length-1,sec:null}; }
    else { ttSecs(effT,effS).push({id:ttUid(),name:v,enabled:true}); ttSel={t:effT,s:effS,sec:ttSecs(effT,effS).length-1}; }
    ttAdd=null; ttSearch=''; renderTenderTreeAll();
  };
  if(acommit) acommit.onclick=doAdd;
  if(ainput){ ainput.onkeydown=(e)=>{ if(e.key==='Enter') doAdd(); else if(e.key==='Escape'){ ttAdd=null; renderTenderTreeAll(); } }; setTimeout(()=>{ try{ainput.focus();}catch(_){} },0); }

  const back=document.getElementById('ttBack'); if(back) back.onclick=()=>{ if(ttSel.sec!=null){ttSel.sec=null;} else if(ttSel.s!=null){ttSel.s=null;ttSel.sec=null;} else {ttSel={t:null,s:null,sec:null};} renderTenderTreeAll(); };
  const si=document.getElementById('ttSearchInp'); if(si){ si.oninput=(e)=>{ ttSearch=e.target.value; renderTenderTreeAll(); const f=document.getElementById('ttSearchInp'); if(f){ try{ f.focus(); f.setSelectionRange(f.value.length,f.value.length);}catch(_){} } }; }
  refreshIcons();
}

/* ---- past tender library (metadata + a viewable tender document per row) ---- */
let ptcUploadIdx = null;
const PTC_MAX_BYTES = 1200000;   // ~1.2 MB raw per file (≈1.6 MB base64) — localStorage budget guard
const PTC_STORE_BUDGET = 4500000; // refuse if the whole item would exceed ~4.5 MB serialized
// Generate a small, self-contained sample tender document (HTML) for the seeded rows.
function ptcSampleDoc(idBase, title, sector, method, ec, year){
  const html='<!doctype html><html lang="en"><head><meta charset="utf-8"><title>'+title+'</title>'
    +'<style>body{font-family:Georgia,"Times New Roman",serif;max-width:720px;margin:32px auto;padding:0 28px;color:#1a1a1a;line-height:1.6}'
    +'h1{font-size:19px;text-align:center;margin:0}h2{font-size:14px;border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:26px}'
    +'.muted{color:#666;text-align:center;margin:4px 0 20px}table{width:100%;border-collapse:collapse;margin:10px 0}'
    +'td,th{border:1px solid #cbd5e1;padding:6px 10px;text-align:left;font-size:13px}th{background:#f1f5f9;width:40%}'
    +'.seal{margin-top:36px;font-size:13px;color:#444}</style></head><body>'
    +'<h1>Ahmedabad Municipal Corporation</h1><p class="muted">Invitation for Bids · sample tender document for cloning</p>'
    +'<h2>1. Notice</h2><p>Sealed online bids are invited for <b>'+title+'</b> under the '+sector+' category.</p>'
    +'<table><tr><th>Tender reference</th><td>'+idBase+'</td></tr><tr><th>Category / Sector</th><td>'+sector+'</td></tr>'
    +'<tr><th>Evaluation method</th><td>'+method+'</td></tr><tr><th>Estimated cost</th><td>'+ec+'</td></tr>'
    +'<tr><th>Award year</th><td>'+year+'</td></tr></table>'
    +'<h2>2. Scope of work</h2><p>The successful bidder shall execute the work as detailed in the schedule, in accordance with GFR 2017 and applicable CVC guidelines.</p>'
    +'<h2>3. Eligibility (PQ)</h2><p>Bidders must meet the pre-qualification turnover and similar-work thresholds specified in the detailed NIT.</p>'
    +'<h2>4. Submission</h2><p>Bids shall be submitted online on the e-procurement portal before the notified deadline. Late bids are not accepted.</p>'
    +'<p class="seal">For Ahmedabad Municipal Corporation<br>Tender Inviting Authority</p></body></html>';
  return { name:idBase+'.html', type:'text/html', kind:'sample', size:html.length, html:html };
}
function ptcFmtSize(n){ n=Number(n)||0; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return Math.round(n/1024)+' KB'; return n+' B'; }
function ptcDataUrlToBlob(dataUrl){
  const c=String(dataUrl).split(','); const meta=c[0]||''; const isB64=/;base64/i.test(meta);
  const mime=(meta.match(/data:([^;,]+)/)||[])[1]||'application/octet-stream';
  const data=c.slice(1).join(',');
  if(isB64){ const bin=atob(data); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
  return new Blob([decodeURIComponent(data)],{type:mime});
}
function ptcViewDoc(doc){
  if(!doc){ return; }
  let blob=null;
  try{ blob = doc.dataUrl ? ptcDataUrlToBlob(doc.dataUrl) : (doc.html ? new Blob([doc.html],{type:'text/html'}) : null); }
  catch(e){ blob=null; }
  if(!blob){ toast('This document can’t be opened.'); return; }
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank');
  if(!win) toast('Allow pop-ups to view the document.');
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 60000);
}
function editorPastTenderCloning(){ return `<div class="space-y-3"><p class="text-[11.5px] text-ink-500">Upload past tenders so they surface on the Clone screen. Each row carries a viewable tender document — view it, replace it, or remove it. Documents are stored locally; very large files are rejected with a message.</p><div id="ptcWrap" class="space-y-2"></div><button class="btn btn-primary" id="ptcUpload"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add past tender</button><input type="file" id="ptcFileInput" accept=".pdf,.doc,.docx,.html,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/html" class="hidden"></div>`; }
function ptcAttachDoc(idx, file){
  if(!file) return;
  if(file.size > PTC_MAX_BYTES){ toast('Document too large to store locally (max ~1.2 MB). Use a smaller file.'); return; }
  const r=new FileReader();
  r.onload=()=>{
    const row=editingDraft[idx]; if(!row) return;
    const prevDoc=row.doc, prevName=row.fileName;
    row.doc={ name:file.name, type:file.type||'application/octet-stream', kind:'upload', size:file.size, dataUrl:r.result };
    row.fileName=file.name;
    // Guard against blowing the localStorage budget for this item.
    let tooBig=false; try{ tooBig = JSON.stringify(editingDraft).length > PTC_STORE_BUDGET; }catch(e){ tooBig=true; }
    if(tooBig){ row.doc=prevDoc; row.fileName=prevName; toast('Document too large to store locally — total exceeds the local limit.'); renderPastTenderCloningAll(); return; }
    toast('Document attached'); renderPastTenderCloningAll();
  };
  r.onerror=()=>toast('Could not read that file.');
  r.readAsDataURL(file);
}

  wrap.querySelectorAll('[data-ptc-docrm]').forEach(b=>b.onclick=()=>{ editingDraft[+b.dataset.ptcDocrm].doc=null; renderPastTenderCloningAll(); });

  const up=document.getElementById('ptcUpload'); if(up&&!up.dataset.bound){ up.dataset.bound='1'; up.onclick=()=>{ editingDraft.push({id:'pt_'+Date.now().toString(36),fileName:'',title:'',sector:'',method:'L1',ec:0,awardedYear:2026,status:'Completed',uploadedAt:'',doc:null}); toast('Past tender added — fill its details and attach a document'); renderPastTenderCloningAll(); }; }
  refreshIcons();
}

      ${open?`<div class="px-3 pb-3 space-y-1.5">${g.chips.map((c,ci)=>`<div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${c.enabled===false?'bg-surface':'bg-white'}">
        <button class="toggle ${c.enabled!==false?'on':''}" data-scg-toggle="${gi}|${ci}"><span class="dot"></span></button>
        <input class="flex-1 bg-transparent text-[13px] ${c.enabled===false?'line-through text-ink-400':'text-ink-900'} focus:outline-none border-0 p-0" data-scg-label="${gi}|${ci}" value="${escapeHtml(c.label||'')}">
        <button class="text-ink-400 hover:text-danger" data-scg-rm="${gi}|${ci}" aria-label="Remove chip"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}
        <button class="btn mt-1" data-scg-add="${gi}"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add chip</button></div>`:''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-scg-exp]').forEach(b=>b.onclick=()=>{const gi=+b.dataset.scgExp;scgExpanded[gi]=scgExpanded[gi]===false?true:false;renderStarterChipsGroupedAll();});
  wrap.querySelectorAll('[data-scg-catrm]').forEach(b=>b.onclick=ev=>{ev&&ev.stopPropagation&&ev.stopPropagation();editingDraft.splice(+b.dataset.scgCatrm,1);renderStarterChipsGroupedAll();});
  wrap.querySelectorAll('[data-scg-toggle]').forEach(b=>b.onclick=()=>{const [gi,ci]=b.dataset.scgToggle.split('|');const c=editingDraft[+gi].chips[+ci];c.enabled=c.enabled===false?true:false;renderStarterChipsGroupedAll();});
  wrap.querySelectorAll('[data-scg-label]').forEach(inp=>inp.oninput=e=>{const [gi,ci]=e.target.dataset.scgLabel.split('|');editingDraft[+gi].chips[+ci].label=e.target.value;});
  wrap.querySelectorAll('[data-scg-rm]').forEach(b=>b.onclick=()=>{const [gi,ci]=b.dataset.scgRm.split('|');editingDraft[+gi].chips.splice(+ci,1);renderStarterChipsGroupedAll();});
  wrap.querySelectorAll('[data-scg-add]').forEach(b=>b.onclick=()=>{editingDraft[+b.dataset.scgAdd].chips.push({label:'New chip',enabled:true});renderStarterChipsGroupedAll();});
  const addCat=document.getElementById('scgAddCat'); const newCat=document.getElementById('scgNewCat');
  if(addCat&&!addCat.dataset.bound){ addCat.dataset.bound='1'; addCat.onclick=()=>{const v=((newCat&&newCat.value)||'').trim();if(!v)return;editingDraft.push({category:v,chips:[]});newCat.value='';renderStarterChipsGroupedAll();}; }
  if(newCat&&!newCat.dataset.bound){ newCat.dataset.bound='1'; newCat.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addCat.click(); } }; }
  refreshIcons();
}

/* ---- AI describe structured questionnaire (questions + pills + skip logic) ---- */
let aiqOpen = null;
function editorAiQuestionnaire(){ return `<div id="aiqWrap" class="space-y-2"></div><button class="btn btn-primary mt-3" id="aiqAdd"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add question</button>`; }
function aiqSourcePills(ref){
  if(ref==='tiers.def'){ const t=getValue('tiers.def'); return Array.isArray(t)?t.map((x,i)=>{ const lab=(x.min==null||x.min===0)?('Under '+inrCompact(x.max)):(x.max==null?('Above '+inrCompact(x.min)):(inrCompact(x.min)+'–'+inrCompact(x.max))); return {label:lab,value:String(x.auth||i)}; }):[]; }
  if(ref==='tender.tree'){ const t=getValue('tender.tree'); return Array.isArray(t)?t.filter(n=>n.enabled!==false).map(n=>({label:n.name,value:n.name})):[]; }
  // generic list source (e.g. dpr.funding-sources) — array of strings or {label}
  { const v=getValue(ref); if(Array.isArray(v)) return v.map(x=>{ const lab=(typeof x==='string')?x:(x.label||x.name||''); return {label:lab,value:lab}; }).filter(p=>p.label); }
  return [];
}
function aiqEffectivePills(q){ return q.sourceRef ? aiqSourcePills(q.sourceRef) : (q.pills||[]); }
function renderAiQuestionnaireAll(){
  if (!Array.isArray(editingDraft)) editingDraft = [];
  editingDraft.forEach(q=>{ if(q.enabled==null) q.enabled=true; if(q.integration===undefined) q.integration=null; });
  const wrap = document.getElementById('aiqWrap');
  const types = ['pills','text','select','multiselect','number'];
  const Q = i => editingDraft[i];
  wrap.innerHTML = editingDraft.length ? editingDraft.map((q,i)=>{
    const open = aiqOpen===q.id;
    const eff = aiqEffectivePills(q);
    const pills = eff.slice(0,6).map(p=>`<span class="chip-input" style="padding:1px 7px;font-size:10.5px">${escapeHtml(p.label)}</span>`).join(' ');
    const head = `<div class="flex items-center gap-2 ${q.enabled===false?'opacity-60':''}">
      <span class="flex flex-col text-ink-400 shrink-0"><button data-aiq-up="${i}" ${i===0?'disabled style="opacity:.3"':''}><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button><button data-aiq-dn="${i}" ${i===editingDraft.length-1?'disabled style="opacity:.3"':''}><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button></span>
      <span class="text-[11px] text-ink-400 w-3 text-center">${i+1}</span>
      <div class="flex-1 min-w-0"><div class="text-[13px] font-medium text-ink-900">${escapeHtml(q.question||'(untitled)')} ${q.required?'<span class="text-[10px] text-danger">required</span>':''}</div>
        <div class="flex items-center gap-1 flex-wrap mt-0.5"><span class="chip-input" style="padding:0 6px;font-size:10px">${escapeHtml(q.inputType||'pills')}</span><span class="text-[10.5px] text-ink-400">${eff.length} pills</span>${q.sourceRef?`<span class="text-[10.5px] text-purple">↗ ${escapeHtml(q.sourceRef)}</span>`:''}${q.integration?`<span class="chip-input" style="padding:0 6px;font-size:10px;background:#EEEDFE;color:#8B5CF6">${escapeHtml(q.integration)}</span>`:''} ${pills}${q.skipIf&&q.skipIf.field?`<span class="text-[10.5px] text-ink-400">skip if ${escapeHtml(q.skipIf.field)}=${escapeHtml(q.skipIf.equals||'')}</span>`:''}</div></div>
      <button class="toggle ${q.enabled!==false?'on':''}" data-aiq-en="${i}" title="Enabled"><span class="dot"></span></button>
      <button class="btn" style="padding:4px 8px" data-aiq-edit="${i}"><i data-lucide="${open?'chevron-up':'sliders-horizontal'}" class="w-3.5 h-3.5"></i></button>
      <button class="text-ink-400 hover:text-danger" data-aiq-del="${i}" aria-label="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
    const pillsBlock = q.sourceRef
      ? `<div><div class="text-[11px] text-ink-500 mb-1">Pills <span class="text-purple">· Synced from ${escapeHtml(q.sourceRef)}</span></div><div class="flex flex-wrap gap-1.5">${eff.map(p=>`<span class="chip-input" style="opacity:.85">${escapeHtml(p.label)}</span>`).join('')||'<span class="text-[11px] text-ink-400">No values from source</span>'}</div></div>`
      : `<div><div class="text-[11px] text-ink-500 mb-1">Pills (label · value)</div><div class="flex flex-wrap gap-1.5 mb-1">${(q.pills||[]).map((p,pi)=>`<span class="chip-input">${escapeHtml(p.label)} <button data-aiq-pilrm="${i}|${pi}">✕</button></span>`).join('')||'<span class="text-[11px] text-ink-400">No pills</span>'}</div><div class="flex gap-1"><input class="inp flex-1" placeholder="label" data-aiq-plabel="${i}"><input class="inp w-28" placeholder="value" data-aiq-pvalue="${i}"><button class="btn" data-aiq-padd="${i}">Add</button></div></div>`;
    const editor = open ? `<div class="mt-2 pt-2 border-t border-line space-y-2 bg-surface p-2 rounded-lg">
      <label class="block"><span class="text-[11px] text-ink-500">Question</span><input class="inp w-full mt-0.5" data-aiq-q="${i}" value="${escapeHtml(q.question||'')}"></label>
      <div class="flex gap-3 items-end flex-wrap"><label class="flex-1"><span class="text-[11px] text-ink-500">Input type</span><select class="inp w-full mt-0.5" data-aiq-type="${i}">${types.map(t=>`<option ${q.inputType===t?'selected':''}>${t}</option>`).join('')}</select></label>
        <label class="flex-1"><span class="text-[11px] text-ink-500">Pills source</span><select class="inp w-full mt-0.5" data-aiq-src="${i}"><option value="" ${!q.sourceRef?'selected':''}>Static (custom pills)</option><option value="tiers.def" ${q.sourceRef==='tiers.def'?'selected':''}>tiers.def (auto)</option><option value="tender.tree" ${q.sourceRef==='tender.tree'?'selected':''}>tender.tree (auto)</option>${(q.sourceRef&&!['tiers.def','tender.tree'].includes(q.sourceRef))?`<option value="${escapeHtml(q.sourceRef)}" selected>${escapeHtml(q.sourceRef)} (auto)</option>`:''}</select></label>
        <div class="flex items-center gap-2 pb-1.5"><button class="toggle ${q.required?'on':''}" data-aiq-req="${i}"><span class="dot"></span></button><span class="text-[12px]">Required</span></div></div>
      ${pillsBlock}
      <div class="flex gap-2"><label class="flex-1"><span class="text-[11px] text-ink-500">Skip if question</span><select class="inp w-full mt-0.5" data-aiq-skipf="${i}"><option value="">— none —</option>${editingDraft.filter(x=>x.id!==q.id).map(x=>`<option value="${escapeHtml(x.id)}" ${q.skipIf&&q.skipIf.field===x.id?'selected':''}>${escapeHtml(x.question)}</option>`).join('')}</select></label>
        <label class="flex-1"><span class="text-[11px] text-ink-500">equals</span><input class="inp w-full mt-0.5" data-aiq-skipv="${i}" value="${escapeHtml(q.skipIf?(q.skipIf.equals||''):'')}"></label></div>
      <label class="block"><span class="text-[11px] text-ink-500">Integration (downstream action)</span><select class="inp w-full mt-0.5" data-aiq-int="${i}"><option value="" ${!q.integration?'selected':''}>None</option><option value="clone-handoff" ${q.integration==='clone-handoff'?'selected':''}>Clone handoff</option><option value="classifier-feed" ${q.integration==='classifier-feed'?'selected':''}>Classifier feed</option></select></label>
    </div>` : '';
    return `<div class="bg-white border border-line rounded-xl p-2.5">${head}${editor}</div>`;
  }).join('') : `<div class="text-[12px] text-ink-400 text-center py-6 border border-dashed border-line rounded-xl">No questions yet.</div>`;
  wrap.querySelectorAll('[data-aiq-en]').forEach(b=>b.onclick=()=>{const q=Q(+b.dataset.aiqEn);q.enabled=q.enabled===false?true:false;renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-src]').forEach(s=>s.onchange=e=>{const q=Q(+e.target.dataset.aiqSrc);if(e.target.value){q.sourceRef=e.target.value;}else{delete q.sourceRef;}renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-int]').forEach(s=>s.onchange=e=>{Q(+e.target.dataset.aiqInt).integration=e.target.value||null;renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-edit]').forEach(b=>b.onclick=()=>{const q=Q(+b.dataset.aiqEdit);aiqOpen=aiqOpen===q.id?null:q.id;renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-del]').forEach(b=>b.onclick=()=>{editingDraft.splice(+b.dataset.aiqDel,1);renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.aiqUp;if(i>0){const t=editingDraft[i-1];editingDraft[i-1]=editingDraft[i];editingDraft[i]=t;renderAiQuestionnaireAll();}});
  wrap.querySelectorAll('[data-aiq-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.aiqDn;if(i<editingDraft.length-1){const t=editingDraft[i+1];editingDraft[i+1]=editingDraft[i];editingDraft[i]=t;renderAiQuestionnaireAll();}});
  wrap.querySelectorAll('[data-aiq-q]').forEach(inp=>inp.oninput=e=>{Q(+e.target.dataset.aiqQ).question=e.target.value;});
  wrap.querySelectorAll('[data-aiq-type]').forEach(s=>s.onchange=e=>{Q(+e.target.dataset.aiqType).inputType=e.target.value;});
  wrap.querySelectorAll('[data-aiq-req]').forEach(b=>b.onclick=()=>{const q=Q(+b.dataset.aiqReq);q.required=!q.required;renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-pilrm]').forEach(b=>b.onclick=()=>{const [i,pi]=b.dataset.aiqPilrm.split('|');(Q(+i).pills||[]).splice(+pi,1);renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-padd]').forEach(b=>b.onclick=()=>{const i=+b.dataset.aiqPadd;const labEl=[...wrap.querySelectorAll('[data-aiq-plabel]')].find(x=>+x.dataset.aiqPlabel===i);const valEl=[...wrap.querySelectorAll('[data-aiq-pvalue]')].find(x=>+x.dataset.aiqPvalue===i);const lab=((labEl&&labEl.value)||'').trim();if(!lab)return;const val=((valEl&&valEl.value)||'').trim()||lab;Q(i).pills=Q(i).pills||[];Q(i).pills.push({label:lab,value:val});renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-skipf]').forEach(s=>s.onchange=e=>{const q=Q(+e.target.dataset.aiqSkipf);if(e.target.value){q.skipIf={field:e.target.value,equals:(q.skipIf&&q.skipIf.equals)||''};}else{q.skipIf=null;}renderAiQuestionnaireAll();});
  wrap.querySelectorAll('[data-aiq-skipv]').forEach(inp=>inp.oninput=e=>{const q=Q(+e.target.dataset.aiqSkipv);if(!q.skipIf)q.skipIf={field:'',equals:''};q.skipIf.equals=e.target.value;});
  const add=document.getElementById('aiqAdd'); if(add&&!add.dataset.bound){add.dataset.bound='1';add.onclick=()=>{const id='q_'+Date.now().toString(36);editingDraft.push({id,question:'New question',order:editingDraft.length+1,inputType:'pills',pills:[],required:false,skipIf:null});aiqOpen=id;renderAiQuestionnaireAll();};}
  refreshIcons();
}

/* ---- Bid Security Declaration policy ---- */
function editorBsdPolicy(){ return `<div class="space-y-4" id="bsdWrap"></div>`; }
function bsdSourceTypes(){ const t=getValue('tender.tree'); if(Array.isArray(t)&&t.length) return t.map(n=>n.name).filter(Boolean); return ['Goods','Works','Services','Consultancy','Engineering Goods']; }
function bsdSourceTiers(){ const t=getValue('tiers.def'); if(Array.isArray(t)&&t.length) return t.map(x=>x.auth).filter(Boolean); return ['HOD','Deputy Commissioner','Commissioner','State Government']; }
function renderBsdPolicyAll(){
  if(!editingDraft||typeof editingDraft!=='object'||Array.isArray(editingDraft)) editingDraft={};
  if(editingDraft.enabled==null) editingDraft.enabled=true;
  editingDraft.allowedForTypes=editingDraft.allowedForTypes||[];
  editingDraft.allowedForValueTiers=editingDraft.allowedForValueTiers||[];
  if(editingDraft.template==null) editingDraft.template='';
  const chip=(label,on,attr)=>`<button class="chip-input" style="cursor:pointer;${on?'background:#EFF6FF;border-color:#93C5FD;color:#0F5EE8':''}" ${attr}>${escapeHtml(label)}</button>`;
  const wrap=document.getElementById('bsdWrap');
  wrap.innerHTML=`
    <div class="flex items-center gap-3 px-3 py-2 border border-line rounded-lg ${editingDraft.enabled?'bg-white':'bg-surface'}"><button class="toggle ${editingDraft.enabled?'on':''}" id="bsdEnabled"><span class="dot"></span></button><div class="flex-1 text-[13px] text-ink-900">Allow Bid Security Declaration (BSD) in lieu of EMD</div></div>
    <div><div class="text-[12px] text-ink-500 mb-1.5">Allowed for tender types</div><div class="flex flex-wrap gap-1.5">${bsdSourceTypes().map(t=>chip(t,editingDraft.allowedForTypes.includes(t),`data-bsd-type="${escapeHtml(t)}"`)).join('')}</div></div>
    <div><div class="text-[12px] text-ink-500 mb-1.5">Allowed for value tiers</div><div class="flex flex-wrap gap-1.5">${bsdSourceTiers().map(t=>chip(t,editingDraft.allowedForValueTiers.includes(t),`data-bsd-tier="${escapeHtml(t)}"`)).join('')}</div></div>
    <label class="block"><span class="text-[12px] text-ink-500">Declaration template</span><textarea id="bsdTemplate" class="inp w-full mt-1" rows="5">${escapeHtml(editingDraft.template)}</textarea></label>`;
  document.getElementById('bsdEnabled').onclick=()=>{editingDraft.enabled=!editingDraft.enabled;renderBsdPolicyAll();};
  wrap.querySelectorAll('[data-bsd-type]').forEach(b=>b.onclick=()=>{const t=b.dataset.bsdType;const a=editingDraft.allowedForTypes;const i=a.indexOf(t);i>=0?a.splice(i,1):a.push(t);renderBsdPolicyAll();});
  wrap.querySelectorAll('[data-bsd-tier]').forEach(b=>b.onclick=()=>{const t=b.dataset.bsdTier;const a=editingDraft.allowedForValueTiers;const i=a.indexOf(t);i>=0?a.splice(i,1):a.push(t);renderBsdPolicyAll();});
  document.getElementById('bsdTemplate').oninput=e=>{editingDraft.template=e.target.value;};
  refreshIcons();
}

/* ---- custom PQ/TQ criterion builder — section-builder card pattern (text / numeric / table + versioning) ---- */
let cbCard=null;        // working copy of the criterion in the open card
let cbCardMode=null;    // 'new' | 'edit'
let cbEditId=null;      // id of the existing criterion being edited
function cbBadge(c){ const m={PQ:'background:#EFF6FF;color:#0F5EE8',TQ:'background:#EEEDFE;color:#8B5CF6',DQ:'background:#FEF2F2;color:#EF4444'}; return `<span class="chip" style="${m[c]||m.PQ}">${escapeHtml(c||'PQ')}</span>`; }
function cbTypeIcon(t){ return ({text:'file-text',numeric:'hash',table:'table'})[t]||'file-text'; }
function cbFreshCriterion(){ return {id:'c_'+Date.now().toString(36),name:'',classification:'PQ',contentType:'text',maxMarks:null,description:'',table:null,numeric:null,version:1,active:true,supersedes:null}; }
function cbTypeFields(c){
  if(c.contentType==='numeric'){ const n=c.numeric||{}; return `<div class="space-y-1.5"><div class="text-[11px] font-medium text-ink-700">Numeric threshold</div><div class="flex gap-2 flex-wrap">
    <label><span class="text-[10.5px] text-ink-400">Min</span><input type="number" class="inp w-24 mt-0.5" data-cbc-nf="min" value="${n.min!=null?n.min:''}"></label>
    <label><span class="text-[10.5px] text-ink-400">Threshold</span><input type="number" class="inp w-28 mt-0.5" data-cbc-nf="threshold" value="${n.threshold!=null?n.threshold:''}"></label>
    <label><span class="text-[10.5px] text-ink-400">Max</span><input type="number" class="inp w-24 mt-0.5" data-cbc-nf="max" value="${n.max!=null?n.max:''}"></label>
    <label><span class="text-[10.5px] text-ink-400">Unit</span><input class="inp w-24 mt-0.5" data-cbc-nf="unit" value="${escapeHtml(n.unit||'')}" placeholder="₹ Cr"></label>
  </div></div>`; }
  if(c.contentType==='table'){ const t=c.table||{columns:[],minRows:1,maxRows:10}; return `<div class="space-y-1.5"><div class="text-[11px] font-medium text-ink-700">Table columns the vendor must fill</div>
    <div class="space-y-1">${(t.columns||[]).map((col,ci)=>`<div class="flex items-center gap-2"><input class="inp flex-1" data-cbc-coln="${ci}" value="${escapeHtml(col.name||'')}" placeholder="Column name"><select class="inp" data-cbc-colt="${ci}">${['text','number','date'].map(tt=>`<option ${col.type===tt?'selected':''}>${tt}</option>`).join('')}</select><button class="toggle ${col.required?'on':''}" data-cbc-colreq="${ci}" title="Required"><span class="dot"></span></button><button class="text-ink-400 hover:text-danger" data-cbc-colrm="${ci}"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>`).join('')||'<div class="text-[11px] text-ink-400 italic">No columns yet.</div>'}</div>
    <button class="btn" id="cbcColAdd">+ column</button>
    <div class="flex gap-2 pt-1"><label><span class="text-[10.5px] text-ink-400">Min rows</span><input type="number" class="inp w-20 mt-0.5" data-cbc-rows="min" value="${t.minRows!=null?t.minRows:0}"></label><label><span class="text-[10.5px] text-ink-400">Max rows</span><input type="number" class="inp w-20 mt-0.5" data-cbc-rows="max" value="${t.maxRows!=null?t.maxRows:0}"></label></div>
  </div>`; }
  return '';
}
function cbCardHtml(){
  const c=cbCard;
  const typeCards=[['text','Text','file-text','Clause or statement'],['numeric','Numeric','hash','Threshold value + unit'],['table','Table','table','Columns the vendor fills']];
  const valid=!!(c.name||'').trim();
  return `<div class="border-2 border-dashed border-primary/40 rounded-xl p-4 space-y-3" style="background:#F8FAFF">
    <div class="text-[13px] font-semibold text-ink-900">${cbCardMode==='edit'?'Edit criterion':'New criterion'}</div>
    <label class="block"><span class="text-[11px] text-ink-500">Criterion title</span><input class="inp w-full mt-0.5" id="cbcName" value="${escapeHtml(c.name||'')}" placeholder="e.g. Average annual turnover — last 3 FY"></label>
    <div><div class="text-[11px] text-ink-500 mb-1">Classification</div><div class="inline-flex rounded-lg border border-line overflow-hidden text-[12px]">
      ${['PQ','TQ','DQ'].map((x,idx)=>`<button data-cbc-class="${x}" class="px-4 py-1.5 ${idx?'border-l border-line ':''}${c.classification===x?'bg-primary text-white':'bg-white text-ink-500 hover:bg-surface'}">${x}</button>`).join('')}
    </div></div>
    <div><div class="text-[11px] text-ink-500 mb-1">Content type</div><div class="grid grid-cols-3 gap-2">
      ${typeCards.map(([v,l,icon,desc])=>`<button data-cbc-ct="${v}" class="text-left p-3 rounded-xl border ${c.contentType===v?'border-primary':'border-line hover:border-primary/40'}" style="${c.contentType===v?'background:#EFF4FF':'background:#fff'}">

        <div class="text-[10.5px] text-ink-500 leading-snug">${desc}</div>
      </button>`).join('')}
    </div></div>
    ${c.classification==='TQ'?`<label class="block" style="width:160px"><span class="text-[11px] text-ink-500">Max marks</span><input type="number" class="inp w-full mt-0.5" id="cbcMarks" value="${c.maxMarks!=null?c.maxMarks:''}" placeholder="e.g. 40"></label>`:''}
    ${c.contentType==='text'
      ? `<label class="block"><span class="text-[11px] text-ink-500">Clause / statement text</span><textarea class="inp w-full mt-0.5" id="cbcDesc" rows="4" placeholder="Draft the clause the vendor must satisfy…">${escapeHtml(c.description||'')}</textarea></label>`
      : `<label class="block"><span class="text-[11px] text-ink-500">Description</span><input class="inp w-full mt-0.5" id="cbcDesc" value="${escapeHtml(c.description||'')}"></label>`}
    ${cbTypeFields(c)}
    <div class="flex items-center justify-between pt-2 border-t border-line">

function editorCriterionBuilder(){ return `<div id="cbWrap" class="space-y-3"></div>`; }

function cbCommitCard(){

/* ---- Evaluation methods & procurement modes (method-aware controls per row) ---- */
const MS_QCBS_RATIOS=['90:10','80:20','70:30','60:40'];
function msNormalize(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) d={};
  if(!Array.isArray(d.methods)) d.methods=[];
  d.methods.forEach(m=>{
    if(!m.group) m.group = /enquiry|\bote\b|\blte\b|\bste\b/i.test((m.label||'')+' '+(m.id||'')) ? 'mode' : 'method';
    if((m.id==='qcbs') || /qcbs/i.test(m.label||'')){
      m.ratios = (Array.isArray(m.ratios)&&m.ratios.length) ? m.ratios : MS_QCBS_RATIOS.slice();
      m.allowedRatios = Array.isArray(m.allowedRatios) ? m.allowedRatios : ((Array.isArray(d.qcbsRatios)&&d.qcbsRatios.length)?d.qcbsRatios.slice():m.ratios.slice());
      if(!m.allowedRatios.includes(m.defaultRatio)) m.defaultRatio = m.allowedRatios[0] || '';
    }
  });
  // legacy sibling sections no longer used
  delete d.sectorDefaults; delete d.qcbsRatios; delete d.tieBreakers; delete d.leafOverrides;
  return d;
}

        <div><div class="text-[11px] text-ink-500 mb-1">Allowed T:F ratios</div><div class="flex flex-wrap gap-1.5">

        </div></div>
        <label class="flex items-center gap-2 text-[12px]"><span class="text-ink-500">Default ratio</span>
          <select class="inp" data-ms-defratio="${gi}">${allowed.length?allowed.map(r=>`<option ${m.defaultRatio===r?'selected':''}>${escapeHtml(r)}</option>`).join(''):'<option value="">— enable a ratio first —</option>'}</select></label>
      </div>`;
    } else if(m.id==='lcs'){
      controls=`<div class="mt-2 pl-1 flex items-center gap-2 text-[12px]"><span class="text-ink-500">Minimum technical cutoff</span><input type="number" min="0" max="100" class="inp w-24 text-right" data-ms-cutoff="${gi}" value="${m.techCutoff!=null?m.techCutoff:''}"><span class="text-ink-400">/ 100</span></div>`;

      controls=`<div class="mt-2 pl-1 text-[11.5px] text-ink-400 italic">Quality-only by definition — the financial quote is not scored, so there are no thresholds.</div>`;
    } else if(m.id==='fbs'){
      controls=`<div class="mt-2 pl-1 text-[11.5px] text-ink-400 italic">Budget is fixed per tender at creation time — no admin-level number here.</div>`;
    } else if(m.id==='ote'){
      controls=`<div class="mt-2 pl-1 flex items-center gap-2 text-[12px]"><span class="text-ink-500">Mandatory above ₹</span><input type="number" class="inp w-36 text-right" data-ms-mandatory="${gi}" value="${m.mandatoryAbove!=null?m.mandatoryAbove:''}"><span class="text-ink-400">${m.mandatoryAbove?aitFmtMoney(m.mandatoryAbove):'GFR Rule 161'}</span></div>`;
    } else if(m.id==='lte'){
      controls=`<div class="mt-2 pl-1 flex items-center gap-2 text-[12px]"><span class="text-ink-500">Allowed up to ₹</span><input type="number" class="inp w-36 text-right" data-ms-upto="${gi}" value="${m.allowedUpto!=null?m.allowedUpto:''}"><span class="text-ink-400">${m.allowedUpto?aitFmtMoney(m.allowedUpto):'GFR Rule 161'}</span></div>`;
    }
    // Locked justification is a statutory fact — always shown, even when the mode is off.
    const lockedJust = m.justifyLocked
      ? `<div class="mt-2 pl-1 flex items-center gap-2 text-[12px]"><button class="toggle on" data-ms-justlocked="${gi}" aria-pressed="true" style="opacity:.6;cursor:not-allowed"><span class="dot"></span></button><span class="text-ink-700">Justification required</span><span class="text-[11px] text-ink-400 italic">— locked on; single-source awards always need a recorded justification (CVC).</span></div>`
      : '';
    return `<div class="rounded-xl border border-line ${on?'bg-white':'bg-surface'} px-3.5 py-2.5">
      <div class="flex items-center gap-3">
        <button class="toggle ${on?'on':''}" data-ms-en="${gi}" aria-pressed="${on}"><span class="dot"></span></button>
        <div class="flex-1 min-w-0 text-[13.5px] font-semibold ${on?'text-ink-900':'text-ink-400'}">${escapeHtml(m.label||'(unnamed)')}</div>
        ${m.custom?`<button class="text-ink-400 hover:text-danger" data-ms-rm="${gi}" aria-label="Remove"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
      </div>
      ${lockedJust}${on?controls:''}
    </div>`;
  };
  const section=(grp,title,desc)=>{
    const rows=d.methods.filter(m=>m.group===grp);
    return `<div class="mb-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-ink-500">${title}</div>
      <div class="text-[11.5px] text-ink-400 mb-2">${desc}</div>
      <div class="space-y-2">${rows.map(m=>rowHtml(m, d.methods.indexOf(m))).join('') || '<div class="text-[12px] text-ink-400 italic">None.</div>'}</div>
    </div>`;
  };
  wrap.innerHTML=`
    ${section('method','Evaluation methods','How qualifying bids are compared and ranked.')}
    ${section('mode','Procurement modes','How vendors are invited — GFR 2017 Rule 161 value gates.')}
    <div class="pt-3 border-t border-line flex items-end gap-2 flex-wrap">
      <label class="block"><span class="text-[11px] text-ink-500">Add to</span>
        <select class="inp mt-0.5" id="msAddGroup"><option value="method">Evaluation methods</option><option value="mode">Procurement modes</option></select></label>
      <label class="flex-1" style="min-width:180px"><span class="text-[11px] text-ink-500">Name</span><input class="inp w-full mt-0.5" id="msAddName" placeholder="e.g. Two-stage bidding"></label>
      <button class="btn btn-primary" id="msAddBtn"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add</button>
    </div>`;
  wrap.querySelectorAll('[data-ms-en]').forEach(b=>b.onclick=()=>{const m=d.methods[+b.dataset.msEn];m.enabled=m.enabled===false?true:false;renderMethodsSuiteAll();});
  wrap.querySelectorAll('[data-ms-rm]').forEach(b=>b.onclick=()=>{d.methods.splice(+b.dataset.msRm,1);renderMethodsSuiteAll();});
  wrap.querySelectorAll('[data-ms-ratio]').forEach(b=>b.onclick=()=>{const [gi,r]=b.dataset.msRatio.split('|');const m=d.methods[+gi];m.allowedRatios=m.allowedRatios||[];const k=m.allowedRatios.indexOf(r);if(k>=0)m.allowedRatios.splice(k,1);else m.allowedRatios.push(r);m.allowedRatios=(m.ratios||MS_QCBS_RATIOS).filter(x=>m.allowedRatios.includes(x));if(!m.allowedRatios.includes(m.defaultRatio))m.defaultRatio=m.allowedRatios[0]||'';renderMethodsSuiteAll();});
  wrap.querySelectorAll('[data-ms-defratio]').forEach(s=>s.onchange=e=>{d.methods[+e.target.dataset.msDefratio].defaultRatio=e.target.value;});
  wrap.querySelectorAll('[data-ms-cutoff]').forEach(inp=>inp.onchange=e=>{const v=e.target.value.trim();d.methods[+e.target.dataset.msCutoff].techCutoff=(v===''?null:Math.max(0,Math.min(100,parseInt(v,10)||0)));});
  wrap.querySelectorAll('[data-ms-mandatory]').forEach(inp=>inp.onchange=e=>{const v=e.target.value.trim();d.methods[+e.target.dataset.msMandatory].mandatoryAbove=(v===''?null:(parseInt(v,10)||0));renderMethodsSuiteAll();});
  wrap.querySelectorAll('[data-ms-upto]').forEach(inp=>inp.onchange=e=>{const v=e.target.value.trim();d.methods[+e.target.dataset.msUpto].allowedUpto=(v===''?null:(parseInt(v,10)||0));renderMethodsSuiteAll();});
  wrap.querySelectorAll('[data-ms-justlocked]').forEach(b=>b.onclick=()=>toast('Justification is mandatory for single-source modes and can’t be switched off.'));
  const addBtn=document.getElementById('msAddBtn'); if(addBtn) addBtn.onclick=()=>{const grp=((document.getElementById('msAddGroup')||{}).value)||'method';const name=(((document.getElementById('msAddName')||{}).value)||'').trim();if(!name)return;d.methods.push({id:'m_'+Date.now().toString(36),group:grp,label:name,enabled:true,custom:true});renderMethodsSuiteAll();};
  refreshIcons();
}

/* ---- Notifications, reminders & escalation (organised per event) ---- */
let neIdx=0;
function editorNotifEvents(){ return `<div id="neWrap"></div>`; }
function renderNotifEventsAll(){
  if(!editingDraft||typeof editingDraft!=='object'||Array.isArray(editingDraft)) editingDraft={};
  const d=editingDraft;
  d.events=d.events||[]; d.channels=d.channels||['Email','SMS','In-app'];
  d.recipientRoles=d.recipientRoles||['Drafter','Tender Inviting Authority','Technical Member','Finance Member','Vigilance Observer','HOD','Procurement Cell'];
  if(neIdx>=d.events.length) neIdx=0;
  const wrap=document.getElementById('neWrap');
  const ev=d.events[neIdx];
  const list=`<div class="w-[230px] shrink-0 border-r border-line pr-3 space-y-1">${d.events.map((e,i)=>`<button data-ne-pick="${i}" class="w-full text-left px-3 py-2 rounded-lg text-[12.5px] ${i===neIdx?'bg-primary text-white font-medium':'text-ink-700 hover:bg-surface'}"><div class="flex items-center justify-between gap-2"><span class="truncate">${escapeHtml(e.name||'(unnamed)')}</span>${e.escalation?`<i data-lucide="alert-triangle" class="w-3.5 h-3.5 ${i===neIdx?'text-white':'text-warning'}"></i>`:''}</div></button>`).join('')}<button class="btn w-full mt-2" id="neAddEvent"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add event</button></div>`;
  let detail='<div class="flex-1 text-[12px] text-ink-400 px-4">No event selected.</div>';
  if(ev){
    ev.channels=ev.channels||{}; ev.recipients=ev.recipients||[];
    const esc=ev.escalation;
    detail=`<div class="flex-1 min-w-0 pl-4 space-y-4">
      <div class="flex items-center gap-2"><input class="inp flex-1 text-[14px] font-medium" data-ne-name value="${escapeHtml(ev.name||'')}"><button class="text-ink-400 hover:text-danger" id="neRmEvent" title="Delete event"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>
      <div><div class="text-[12px] font-medium text-ink-900 mb-1">Reminders</div><input class="inp w-full" data-ne-reminders value="${escapeHtml(ev.reminders||'')}" placeholder="Offsets e.g. D-7, D-3, D-1, H-4 (blank = none)"><div class="text-[11px] text-ink-400 mt-1">Comma-separated offsets — D-N days before, H-N hours before.</div></div>
      <div><div class="text-[12px] font-medium text-ink-900 mb-1.5">Channels</div><div class="flex flex-wrap gap-1.5">${d.channels.map(c=>{const on=ev.channels[c];return `<button class="chip-input" style="cursor:pointer;${on?'background:#EFF6FF;border-color:#93C5FD;color:#0F5EE8':''}" data-ne-chan="${escapeHtml(c)}">${escapeHtml(c)}</button>`;}).join('')}</div></div>
      <div><div class="text-[12px] font-medium text-ink-900 mb-1.5">Recipients</div><div class="flex flex-wrap gap-1.5">${d.recipientRoles.map(r=>{const on=ev.recipients.includes(r);return `<button class="chip-input" style="cursor:pointer;${on?'background:#EFF6FF;border-color:#93C5FD;color:#0F5EE8':''}" data-ne-rcpt="${escapeHtml(r)}">${escapeHtml(r)}</button>`;}).join('')}</div></div>
      <div class="pt-3 border-t border-line"><div class="flex items-center gap-2 mb-2"><button class="toggle ${esc?'on':''}" id="neEscToggle"><span class="dot"></span></button><span class="text-[13px] font-medium text-ink-900">Escalate if breached</span></div>
        ${esc?`<div class="flex items-end gap-3 flex-wrap"><label class="block"><span class="text-[12px] text-ink-500">Breach after (hours)</span><input type="number" class="inp w-28 mt-0.5" id="neEscHours" value="${esc.breachHours!=null?esc.breachHours:24}"></label><label class="block"><span class="text-[12px] text-ink-500">Escalate to</span><select class="inp mt-0.5" id="neEscTo">${pgRoles().concat(esc.escalateTo&&!pgRoles().includes(esc.escalateTo)?[esc.escalateTo]:[]).map(r=>`<option ${esc.escalateTo===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}</select></label></div>`:''}</div>
    </div>`;
  }
  wrap.innerHTML=`<div class="flex gap-1">${list}${detail}</div>`;
  wrap.querySelectorAll('[data-ne-pick]').forEach(b=>b.onclick=()=>{neIdx=+b.dataset.nePick;renderNotifEventsAll();});
  const addEv=document.getElementById('neAddEvent'); if(addEv) addEv.onclick=()=>{d.events.push({name:'New event',reminders:'',channels:{Email:true,SMS:false,'In-app':true},recipients:[],escalation:null});neIdx=d.events.length-1;renderNotifEventsAll();};
  const nm=wrap.querySelector('[data-ne-name]'); if(nm) nm.oninput=e=>{ev.name=e.target.value;wrap.querySelectorAll('[data-ne-pick]')[neIdx].querySelector('span').textContent=e.target.value||'(unnamed)';};
  const rem=wrap.querySelector('[data-ne-reminders]'); if(rem) rem.oninput=e=>{ev.reminders=e.target.value;};
  const rmEv=document.getElementById('neRmEvent'); if(rmEv) rmEv.onclick=()=>{d.events.splice(neIdx,1);neIdx=0;renderNotifEventsAll();};
  wrap.querySelectorAll('[data-ne-chan]').forEach(b=>b.onclick=()=>{const c=b.dataset.neChan;ev.channels[c]=!ev.channels[c];renderNotifEventsAll();});
  wrap.querySelectorAll('[data-ne-rcpt]').forEach(b=>b.onclick=()=>{const r=b.dataset.neRcpt;const i=ev.recipients.indexOf(r);i>=0?ev.recipients.splice(i,1):ev.recipients.push(r);renderNotifEventsAll();});
  const escT=document.getElementById('neEscToggle'); if(escT) escT.onclick=()=>{ev.escalation=ev.escalation?null:{breachHours:24,escalateTo:pgRoles()[0]||'HOD'};renderNotifEventsAll();};
  const escH=document.getElementById('neEscHours'); if(escH) escH.onchange=e=>{ev.escalation.breachHours=parseInt(e.target.value,10)||0;};
  const escTo=document.getElementById('neEscTo'); if(escTo) escTo.onchange=e=>{ev.escalation.escalateTo=e.target.value;};
  refreshIcons();
}

/* ---- Corrigendum policy — 7 GePNIC types + auto-draft triggers ---- */
function editorCorrigendumGepnic(){ return `<div id="cgWrap" class="space-y-5"></div>`; }
function renderCorrigendumGepnicAll(){
  if(!editingDraft||typeof editingDraft!=='object'||Array.isArray(editingDraft)) editingDraft={};
  const d=editingDraft;
  d.types=d.types||[]; d.autoDraftTriggers=d.autoDraftTriggers||[];
  d.cutoffOptions=d.cutoffOptions||['Before bid submission start','Before bid submission end','Before bid opening','Any stage'];
  if(d.autoExtend==null) d.autoExtend=true; if(d.extensionDays==null) d.extensionDays=7;
  const typeNames=d.types.map(t=>t.name).filter(Boolean);
